<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Region Profile · Sentinel Hub</title>
<script>
  // Region detail follows theme selected on dashboard/IP detail.
  document.documentElement.dataset.theme = localStorage.getItem('sentinel-theme') || 'dark';
</script>
<style>
:root{color-scheme:dark;--void:#071014;--console:#0b171c;--raised:#102229;--ink:#e6f1f2;--secondary:#9db2b7;--tertiary:#6f858b;--line:rgba(214,243,247,.1);--cyan:#48c8d8;--green:#55d19a;--yellow:#e8bd61;--red:#e77e76;--r:7px}html[data-theme="light"]{color-scheme:light;--void:#f3f7f8;--console:#fff;--raised:#eaf1f3;--ink:#15252b;--secondary:#49616a;--tertiary:#71848b;--line:rgba(22,54,64,.14);--cyan:#087f91;--green:#087c55;--yellow:#9a6b00;--red:#b3423b}*{box-sizing:border-box}body{margin:0;background:var(--void);color:var(--ink);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}.shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh}aside{padding:20px 14px;border-right:1px solid var(--line)}.brand{display:flex;align-items:center;gap:10px;padding:0 8px 24px}.brand-mark{display:grid;width:32px;height:32px;place-items:center;border:1px solid var(--cyan);border-radius:5px;color:var(--cyan);font-weight:800}.brand small,.meta,.eyebrow{display:block;color:var(--tertiary)}nav{display:grid;gap:4px}.nav{min-height:40px;padding:10px;border-radius:5px;color:var(--secondary);text-decoration:none}.nav:hover,.nav.active{background:var(--raised);color:var(--ink)}main{max-width:1280px;width:100%;padding:40px 48px}.back{display:inline-block;margin-bottom:22px;color:var(--secondary);text-decoration:none}.back:hover{color:var(--cyan)}.hero{display:grid;grid-template-columns:1fr 220px;gap:16px;margin-bottom:16px}.identity,.market,.card{border:1px solid var(--line);border-radius:var(--r);background:var(--console)}.identity{padding:26px}.identity h1{margin:5px 0 7px;font-size:32px;letter-spacing:-.03em}.market{display:grid;padding:22px;place-content:center;text-align:center}.market strong{color:var(--cyan);font:650 48px/1 ui-monospace,monospace;font-variant-numeric:tabular-nums}.market span{margin-top:9px;color:var(--secondary);text-transform:uppercase;letter-spacing:.1em;font-size:11px}.layout{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.column{display:grid;align-content:start;gap:16px}.card-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}.card-head h2{margin:0;font-size:15px}.body{display:grid;gap:10px;padding:18px}.item{padding:13px;border-radius:5px;background:var(--raised)}.item-top{display:flex;align-items:start;justify-content:space-between;gap:12px}.item strong{font-size:13px}.item p{margin:7px 0;color:var(--secondary)}.source{color:var(--tertiary);font-size:11px}.tag{padding:2px 7px;border:1px solid var(--line);border-radius:999px;color:var(--secondary);font:700 10px ui-monospace,monospace}.tag.critical,.tag.high{color:var(--red)}.tag.medium{color:var(--yellow)}.tag.low{color:var(--green)}.effect{color:var(--cyan);font:650 18px ui-monospace,monospace}.source-link{color:var(--cyan);text-decoration:none}.source-link:hover{text-decoration:underline}.state{padding:48px;border:1px solid var(--line);border-radius:var(--r);background:var(--console);color:var(--secondary);text-align:center}.state strong{display:block;margin-bottom:6px;color:var(--ink)}.button{min-height:40px;padding:0 12px;border:1px solid var(--line);border-radius:5px;background:var(--console);color:var(--ink);cursor:pointer}.button:hover{background:var(--raised)}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font:700 11px ui-monospace,monospace}@media(max-width:900px){.shell{display:block}aside{display:none}main{padding:24px}.layout,.hero{grid-template-columns:1fr}.market{place-content:start;text-align:left}.market strong{font-size:36px}}@media(max-width:600px){main{padding:18px}.item-top{display:block}.tag{display:inline-block;margin-top:8px}}
</style>
</head>
<body><div class="shell"><aside><div class="brand"><div class="brand-mark">S</div><div><strong>Sentinel Hub</strong><small>remote monitor</small></div></div><nav><a class="nav" href="/">⌁ Overview</a><a class="nav" href="/#threats">◎ IP Intelligence</a><a class="nav active" href="/regions">◇ Region profiles</a></nav></aside><main id="app"><div class="state"><strong>Loading region profile…</strong>Reading local context and provenance.</div></main></div>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const code=decodeURIComponent(location.pathname.split('/').filter(Boolean).pop()).toUpperCase(),app=document.querySelector('#app');const sourceLine=x=>`${esc(x.source||'Unknown source')}${x.date||x.data_date?` · ${esc(x.date||x.data_date)}`:''}`;function indicatorItems(items){return Array.isArray(items)?items:Object.values(items?.indicators||{});}function indicators(items,type){items=indicatorItems(items);return items?.length?items.map(x=>`<article class="item"><div class="item-top"><strong>${esc(x.label||x.type||type)}</strong>${type==='conflict'?`<span class="tag ${esc(x.severity||'')}">${esc(x.severity||'unknown')}</span>`:''}</div><p>${esc(x.description||x.value||'Unknown')}</p><div class="source">${sourceLine(x)}</div></article>`).join(''):'<div class="meta">No data available.</div>'}async function load(){try{const response=await fetch('/api/regions/'+encodeURIComponent(code),{cache:'no-store'});if(!response.ok)throw Error(response.status===404?'Region profile not found':`HTTP ${response.status}`);const r=await response.json();document.title=`${r.country_name} · Region Profile`;app.innerHTML=`<a class="back" href="/regions">← All region profiles</a><section class="hero"><div class="identity"><div class="eyebrow">${esc(r.country_code)} · sourced country context</div><h1>${esc(r.country_name)}</h1><div class="meta">${Number(r.observed_ip_count||0).toLocaleString()} observed IPs · updated ${esc(r.updated_at||'unknown')}</div></div><div class="market"><strong>${r.market_score==null?'—':esc(r.market_score)}</strong><span>${esc(r.market_level||'unknown')} market score</span></div></section><div class="layout"><div class="column"><section class="card"><header class="card-head"><h2>Economic indicators</h2><span class="eyebrow">commercial context</span></header><div class="body">${indicators(r.economic_indicators,'economic')}</div></section><section class="card"><header class="card-head"><h2>Conflict indicators</h2><span class="eyebrow">normalized</span></header><div class="body">${indicators(r.conflict_indicators,'conflict')}</div></section></div><div class="column"><section class="card"><header class="card-head"><h2>Market components</h2><span class="eyebrow">weighted score</span></header><div class="body">${Object.entries(r.market_components||{}).map(([key,value])=>`<article class="item"><div class="item-top"><strong>${esc(key.replaceAll("_"," "))}</strong><span class="effect">${value==null?"—":esc(Math.round(value))}</span></div></article>`).join("")}</div></section><section class="card"><header class="card-head"><h2>Woodworking machinery imports</h2><span class="eyebrow">2018–2025</span></header><div class="body">${(r.economic_indicators?.trade?.woodworking_machinery?.series||[]).map(x=>`<article class="item"><div class="item-top"><strong>${esc(x.year)}</strong><span class="effect">${esc(x.value)}</span></div></article>`).join("")}</div></section><section class="card"><header class="card-head"><h2>Product opportunities</h2><span class="eyebrow">sub-HS mix</span></header><div class="body">${(r.product_opportunities||[]).map(x=>`<article class="item"><div class="item-top"><strong>${esc(x.product||x.hs_code)}</strong><span class="effect">${esc(x.score)}</span></div><p>${esc(x.hs_code)} · ${esc(x.level||"unknown")}</p></article>`).join("")}</div></section><section class="card"><header class="card-head"><h2>Market score evidence</h2><span class="eyebrow">market components</span></header><div class="body">${(r.market_evidence||[]).length?r.market_evidence.map(x=>`<article class="item"><div class="item-top"><strong>${esc(x.signal.replaceAll('_',' '))}</strong><span class="effect">+${esc(x.effect)}</span></div><p>${esc(x.value??x.raw_value??x.percentile??'—')} · ${esc(x.points??x.percentile??'—')} points × ${esc(x.weight??'—')}</p><div class="source">${sourceLine(x)}</div></article>`).join(''):'<div class="meta">Market score unavailable.</div>'}</div></section><section class="card"><header class="card-head"><h2>Sources</h2><span class="eyebrow">provenance</span></header><div class="body">${(r.sources||[]).length?r.sources.map(x=>`<article class="item"><div class="item-top"><strong>${esc(x.name||'Unknown')}</strong><span class="tag">${esc(x.type||'source')}</span></div>${x.url?`<p><a class="source-link" href="${esc(x.url)}" rel="noreferrer">Open source reference</a></p>`:''}</article>`).join(''):'<div class="meta">No source metadata available.</div>'}</div></section></div></div>`}catch(error){app.innerHTML=`<a class="back" href="/regions">← All region profiles</a><div class="state"><strong>Region profile unavailable</strong>${esc(error.message)}</div>`}}load();
</script>
<script>
  // Keep already-open region detail synchronized if another app page changes theme.
  window.addEventListener('storage', (event) => {
    if (event.key === 'sentinel-theme' && event.newValue) {
      document.documentElement.dataset.theme = event.newValue;
    }
  });
</script></body></html>
