<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Region Profiles · Sentinel Hub</title>
<style>
:root{color-scheme:dark;--void:#071014;--console:#0b171c;--raised:#102229;--ink:#e6f1f2;--secondary:#9db2b7;--tertiary:#6f858b;--line:rgba(214,243,247,.1);--cyan:#48c8d8;--green:#55d19a;--r:7px}html[data-theme="light"]{color-scheme:light;--void:#f3f7f8;--console:#fff;--raised:#eaf1f3;--ink:#15252b;--secondary:#49616a;--tertiary:#71848b;--line:rgba(22,54,64,.14);--cyan:#087f91;--green:#087c55}*{box-sizing:border-box}body{margin:0;background:var(--void);color:var(--ink);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}.shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh}aside{padding:20px 14px;border-right:1px solid var(--line)}.brand{display:flex;align-items:center;gap:10px;padding:0 8px 24px}.brand-mark{display:grid;width:32px;height:32px;place-items:center;border:1px solid var(--cyan);border-radius:5px;color:var(--cyan);font-weight:800}.brand small,.meta,.eyebrow{display:block;color:var(--tertiary)}nav{display:grid;gap:4px}.nav{min-height:40px;padding:10px;border-radius:5px;color:var(--secondary);text-decoration:none}.nav:hover,.nav.active{background:var(--raised);color:var(--ink)}main{max-width:1280px;width:100%;padding:40px 48px}.top{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:28px}h1{margin:4px 0 6px;font-size:30px;letter-spacing:-.03em}p{margin:0;color:var(--secondary)}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font:700 11px ui-monospace,monospace}.controls{display:flex;gap:8px}.search,.sort,.button{min-height:40px;border:1px solid var(--line);border-radius:5px;background:var(--console);color:var(--ink)}.search{width:280px;padding:0 12px}.sort{padding:0 10px}.button{padding:0 12px;cursor:pointer}.button:hover{background:var(--raised)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{min-height:210px;padding:20px;border:1px solid var(--line);border-radius:var(--r);background:var(--console);color:inherit;text-decoration:none;transition:transform 140ms cubic-bezier(.23,1,.32,1),background 140ms}.card:hover{transform:translateY(-2px);background:var(--raised)}.card:focus-visible,.search:focus-visible,.sort:focus-visible,.button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}.card-head{display:flex;justify-content:space-between;gap:12px}.country{margin:7px 0 0;font-size:19px}.score{color:var(--cyan);font:650 28px/1 ui-monospace,monospace;font-variant-numeric:tabular-nums}.score small{display:block;margin-top:7px;color:var(--tertiary);font:600 10px ui-sans-serif,system-ui}.signals{display:grid;gap:9px;margin-top:25px}.signal{display:flex;justify-content:space-between;gap:12px;padding-top:9px;border-top:1px solid var(--line);color:var(--secondary);font-size:12px}.signal strong{color:var(--ink);font-weight:600}.state{grid-column:1/-1;padding:48px;border:1px solid var(--line);border-radius:var(--r);background:var(--console);color:var(--secondary);text-align:center}.state strong{display:block;margin-bottom:5px;color:var(--ink)}@media(max-width:920px){.shell{display:block}aside{display:none}main{padding:24px}.grid{grid-template-columns:1fr 1fr}}@media(max-width:620px){main{padding:18px}.top{align-items:stretch;flex-direction:column}.controls,.search{width:100%}.grid{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
</style>
</head>
<body><div class="shell"><aside><div class="brand"><div class="brand-mark">S</div><div><strong>Sentinel Hub</strong><small>remote monitor</small></div></div><nav><a class="nav" href="/">⌁ Overview</a><a class="nav" href="/#threats">◎ IP Intelligence</a><a class="nav active" href="/regions">◇ Region profiles</a></nav></aside><main><header class="top"><div><div class="eyebrow">Country context registry</div><h1>Region profiles</h1><p>Commercial context and sourced conflict indicators, separate from IP security scoring.</p></div><div class="controls"><input class="search" id="search" type="search" placeholder="Search country or code" aria-label="Search regions"><select class="sort" id="sort" aria-label="Sort regions"><option value="score">Score: high to low</option><option value="country">Country: A to Z</option></select><button class="button" id="theme" type="button">Light mode</button></div></header><section class="grid" id="grid"><div class="state"><strong>Loading region profiles…</strong>Reading local region context.</div></section></main></div>
<script>
const economicItems=r=>Array.isArray(r.economic_indicators)?r.economic_indicators:Object.values((r.economic_indicators||{}).indicators||{});const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let regions=[];const grid=document.querySelector('#grid'),search=document.querySelector('#search'),sort=document.querySelector('#sort');function render(){const q=search.value.trim().toLowerCase(),items=regions.filter(r=>!q||`${r.country_name} ${r.country_code}`.toLowerCase().includes(q)).sort((a,b)=>sort.value==='country'?String(a.country_name||'').localeCompare(String(b.country_name||'')):((b.market_score==null?-1:b.market_score)-(a.market_score==null?-1:a.market_score))||String(a.country_name||'').localeCompare(String(b.country_name||'')));grid.innerHTML=items.length?items.map(r=>{const components=r.market_components||{},economic=components.economic_potential,machineDemand=components.machine_demand;return `<a class="card" href="/regions/${encodeURIComponent(r.country_code)}"><div class="card-head"><div><div class="eyebrow">${esc(r.country_code)}</div><h2 class="country">${esc(r.country_name)}</h2></div><div class="score">${r.market_score==null?'—':esc(r.market_score)}<small>${esc(r.market_level||'unknown')}</small></div></div><div class="signals"><div class="signal"><span>Economic potential</span><strong>${economic==null?'unknown':esc(Math.round(economic))}</strong></div><div class="signal"><span>Machine demand</span><strong>${machineDemand==null?'unknown':esc(Math.round(machineDemand))}</strong></div><div class="signal"><span>Industrial fit</span><strong>${components.industrial_fit==null?'unknown':esc(Math.round(components.industrial_fit))}</strong></div><div class="signal"><span>Observed IPs</span><strong>${Number(r.observed_ip_count||0).toLocaleString()}</strong></div><div class="meta">Updated ${esc(r.updated_at||'unknown')}</div></div></a>`}).join(''):'<div class="state"><strong>No matching regions</strong>Try another country or code.</div>'}async function load(){try{const response=await fetch('/api/regions?limit=200',{cache:'no-store'});if(!response.ok)throw Error(`HTTP ${response.status}`);regions=await response.json();render()}catch(error){grid.innerHTML=`<div class="state"><strong>Region profiles unavailable</strong>${esc(error.message)}</div>`}}search.addEventListener('input',render);sort.addEventListener('change',render);const theme=document.querySelector('#theme'),saved=localStorage.getItem('sentinel-theme')||'dark';document.documentElement.dataset.theme=saved;theme.textContent=saved==='dark'?'Light mode':'Dark mode';theme.onclick=()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('sentinel-theme',next);theme.textContent=next==='dark'?'Light mode':'Dark mode'};load();
</script></body></html>
