<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IP Case · Sentinel Hub</title>
<style>
:root{color-scheme:dark;--void:#090c0f;--console:#0d1115;--deck:#11171c;--raised:#151c22;--ink:#edf3f5;--secondary:#a8b3b9;--tertiary:#76838a;--line:rgba(224,244,248,.09);--cyan:#59d8e6;--green:#64d59a;--yellow:#e8bd5b;--red:#ff766d;--r:8px}*{box-sizing:border-box}html{-webkit-font-smoothing:antialiased;background:var(--void)}body{margin:0;background:var(--void);color:var(--ink);font:13px/1.45 "Avenir Next",Avenir,"Segoe UI",sans-serif}a{color:inherit}.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}aside{position:sticky;top:0;height:100vh;padding:20px 12px;border-right:1px solid var(--line)}.brand{display:flex;gap:10px;align-items:center;padding:0 8px 22px}.brand-mark{display:grid;place-items:center;width:30px;height:30px;border:1px solid #59d8e655;border-radius:7px;color:var(--cyan);font:700 15px monospace}.brand strong{display:block;font-size:13px;letter-spacing:.08em;text-transform:uppercase}.brand small{color:var(--tertiary)}nav{display:grid;gap:3px}.nav-item{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 10px;border-radius:5px;color:var(--tertiary);text-decoration:none;font-weight:600}.nav-item:hover,.nav-item.active{color:var(--ink);background:var(--deck)}.nav-item.active{box-shadow:inset 2px 0 var(--cyan)}.site-state{position:absolute;left:12px;right:12px;bottom:16px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--console)}.eyebrow{font:600 10px/1.2 monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--tertiary)}.online{display:flex;gap:7px;margin-top:7px;color:var(--secondary)}.dot{width:7px;height:7px;margin-top:5px;border-radius:50%;background:var(--green)}main{max-width:1280px;width:100%;padding:24px 32px 48px}.back{display:inline-block;margin-bottom:24px;color:var(--tertiary);text-decoration:none}.back:hover{color:var(--cyan)}.hero{display:flex;justify-content:space-between;gap:24px;padding-bottom:24px;border-bottom:1px solid var(--line)}h1{margin:5px 0 8px;font:650 clamp(27px,4vw,42px)/1.05 monospace;letter-spacing:-.055em}.subtitle{color:var(--secondary)}.actions{display:flex;gap:8px;flex-wrap:wrap}.button{display:inline-flex;align-items:center;min-height:40px;padding:0 13px;border:1px solid var(--line);border-radius:5px;background:var(--deck);color:var(--secondary);text-decoration:none;font-weight:700}.button:hover{color:var(--ink);background:var(--raised)}.button.primary{background:var(--cyan);border-color:transparent;color:#061013}.hero-grid{display:grid;grid-template-columns:1.5fr repeat(4,1fr);gap:1px;margin:24px 0;background:var(--line)}.stat{min-height:105px;padding:17px;background:var(--console)}.stat:first-child{background:var(--deck)}.value{display:block;margin-top:10px;font:650 26px/1 monospace;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}.accent{color:var(--cyan)}.note{display:block;margin-top:8px;color:var(--tertiary);font-size:11px}.layout{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(280px,.75fr);gap:16px;align-items:start}.column{display:grid;gap:16px}.card{border:1px solid var(--line);border-radius:12px;background:var(--console);overflow:hidden}.card-head{display:flex;justify-content:space-between;gap:12px;padding:15px 17px;border-bottom:1px solid var(--line)}.card-head h2{margin:0;font-size:14px}.card-head small{color:var(--tertiary)}.body{padding:17px}.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line)}.fact{min-height:68px;padding:12px;background:var(--console)}.label{display:block;color:var(--tertiary);font-size:11px}.fact strong{display:block;margin-top:5px;font:600 13px monospace;overflow-wrap:anywhere}.source{display:block;margin-top:4px;color:var(--tertiary);font-size:10px}.decision{padding:17px;background:rgba(89,216,230,.055)}.decision-top{display:flex;justify-content:space-between;gap:20px}.decision h2{margin:7px 0;font:650 22px/1.1 monospace;text-transform:uppercase}.decision p{margin:0;color:var(--secondary)}.score{color:var(--cyan);font:650 30px/1 monospace}.score small{display:block;margin-top:5px;color:var(--tertiary);font:11px sans-serif}.bar{height:5px;margin-top:18px;background:#fff1;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--cyan)}.breakdown{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:17px}.breakdown div{padding-top:11px;border-top:1px solid var(--line)}.breakdown b{display:block;font:600 17px monospace}.breakdown span{display:block;margin-top:3px;color:var(--tertiary);font-size:10px}.pill{display:inline-block;padding:4px 8px;border:1px solid var(--line);border-radius:4px;color:var(--secondary);font:700 10px monospace;text-transform:uppercase}.pill.bad{color:var(--red);border-color:#ff766d55}.pill.watch{color:var(--yellow);border-color:#e8bd5b55}.pill.good{color:var(--green);border-color:#64d59a55}.evidence{display:grid;gap:8px}.evidence-item{padding:10px 12px;border-left:2px solid var(--line);background:#fff003;color:var(--secondary);font-size:12px}.evidence-item.a{border-left-color:var(--cyan)}.evidence-item.b{border-left-color:var(--yellow)}.evidence-item.c{border-left-color:var(--green)}.evidence-item.d{border-left-color:var(--red)}.sources{display:grid;gap:6px;margin:0;padding:0;list-style:none}.sources li{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px solid var(--line);color:var(--secondary);font-size:12px}.sources em{color:var(--tertiary);font-style:normal;text-align:right}.state{padding:64px 20px;text-align:center;color:var(--tertiary)}.state strong{display:block;margin-bottom:5px;color:var(--secondary)}@media(max-width:900px){.shell{display:block}aside{display:none}main{padding:18px 16px 36px}.hero-grid{grid-template-columns:repeat(2,1fr)}.stat:first-child{grid-column:1/-1}.layout{grid-template-columns:1fr}}@media(max-width:560px){.hero{display:block}.actions{margin-top:18px}.facts{grid-template-columns:1fr}.decision-top{display:block}.score{margin-top:18px}.breakdown{grid-template-columns:repeat(2,1fr)}}
</style>
<style>
html[data-theme="light"]{color-scheme:light;--void:#f3f7f8;--console:#fff;--deck:#eaf1f3;--raised:#e1ebee;--ink:#15252b;--secondary:#49616a;--tertiary:#71848b;--line:rgba(22,54,64,.14);--cyan:#087f91;--green:#087c55;--yellow:#9a6b00;--red:#b3423b}
.theme-float{position:fixed;right:24px;bottom:24px;z-index:5;min-height:40px;padding:0 13px;border:1px solid var(--line);border-radius:5px;background:var(--deck);color:var(--secondary);font-weight:700;cursor:pointer}.theme-float:hover{color:var(--ink);background:var(--raised)}
</style>
<body><div class="shell"><aside><div class="brand"><div class="brand-mark">S</div><div><strong>Sentinel Hub</strong><small>remote monitor</small></div></div><nav><a class="nav-item" href="/">⌁ Overview</a><a class="nav-item active" href="/#threats">◎ IP Intelligence</a><a class="nav-item" href="/regions">◇ Region profiles</a></nav><div class="site-state"><div class="eyebrow">Hub state</div><div class="online"><span class="dot"></span>Read-only · Online</div></div></aside><main id="app"><div class="state"><strong>Loading IP case…</strong>Correlating geo, network and observed behavior.</div></main></div>
<script>
const initialTheme=localStorage.getItem('sentinel-theme')||'dark';document.documentElement.dataset.theme=initialTheme;const API_BASE=(location.protocol==='file:'||!['127.0.0.1:8000','localhost:8000'].includes(location.host))?'http://127.0.0.1:8000':'';const apiUrl=path=>API_BASE+path;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const num=v=>Number(v||0).toLocaleString();const ip=decodeURIComponent(location.pathname.split('/').pop());
const nativeFetch=window.fetch.bind(window);window.fetch=(input,...args)=>nativeFetch(typeof input==='string'&&input.startsWith('/api/')?apiUrl(input):input,...args);
function facts(items){return `<div class="facts">${items.map(([a,b,s])=>`<div class="fact"><span class="label">${esc(a)}</span><strong>${esc(b??'Unknown')}</strong>${s?`<span class="source">${esc(s)}</span>`:''}</div>`).join('')}</div>`}function list(items){return items?.length?items.map(x=>{const t=String(x),g=/^([ABCDE])\s—/.exec(t)?.[1]?.toLowerCase()||'';return `<div class="evidence-item ${g}">${esc(t)}</div>`}).join(''):'<div class="evidence-item">No evidence available.</div>'}function yes(v){return v==null?'Unknown':v?'Yes':'No'}
async function load(){try{const res=await fetch('/api/ip/'+encodeURIComponent(ip));if(!res.ok)throw Error(res.status===404?'IP case not found':'Could not load profile');const d=await res.json(),o=d.observation||{},r=d.region_profile||{},c=d.classification||{},b=c.score_breakdown||{},label=c.label||'unknown',score=Number(d.threat_signal_score??0),src=d.field_sources||{};document.title=`${ip} · Sentinel Hub`;document.querySelector('#app').innerHTML=`<a class="back" href="/#threats">← Back to IP intelligence</a><section class="hero"><div><div class="eyebrow">Investigation case / IP intelligence</div><h1>${esc(ip)}</h1><div class="subtitle">${esc(d.country||'Unknown location')} · ${esc(d.organization||d.network_type||'Unattributed network')} · first seen ${esc(o.first_seen||'profile only')}</div></div><div class="actions"><a class="button" href="/regions/${encodeURIComponent(d.country_code||"unknown")}">Region profile</a><a class="button" href="/#threats">Return to table</a><a class="button primary" href="/api/ip/${encodeURIComponent(ip)}?refresh=true">Refresh enrichment</a></div></section><section class="hero-grid"><div class="stat"><div class="eyebrow">Classification</div><span class="value accent">${esc(label.toUpperCase())}</span><span class="note">${esc(c.summary||'Insufficient evidence')}</span></div><div class="stat"><div class="eyebrow">Rule score</div><span class="value">${score}/100</span><span class="note">confidence ${esc(c.confidence??'—')}%</span></div><div class="stat"><div class="eyebrow">Requests</div><span class="value">${num(o.requests)}</span><span class="note">${num(o.unique_paths)} unique paths</span></div><div class="stat"><div class="eyebrow">4xx ratio</div><span class="value">${o.requests?Math.round(Number(o.status_4xx||0)/Number(o.requests)*100):0}%</span><span class="note">${num(o.status_4xx)} responses</span></div><div class="stat"><div class="eyebrow">Core status</div><span class="value">${esc(d.core_enrichment_status||'unknown')}</span><span class="note">${esc(d.fetched_at||'')}</span></div></section><div class="layout"><div class="column"><section class="card"><div class="card-head"><h2>Decision summary</h2><small>auditable rule groups</small></div><div class="decision"><div class="decision-top"><div><span class="pill ${esc(label)}">${esc(label)}</span><h2>${esc(c.summary||'Insufficient evidence')}</h2><p>Behavior is primary; identity supports the decision and region is only a small nudge.</p></div><div class="score">${score}<small>rule score / 100</small></div></div><div class="bar"><i style="width:${Math.min(100,score)}%"></i></div><div class="breakdown"><div><b>${b.behavior_a??0}</b><span>A · behavior</span></div><div><b>${b.identity_b??0}</b><span>B · identity cap 25</span></div><div><b>${b.trust_c??0}</b><span>C · trust</span></div><div><b>${b.region_d??0}</b><span>D · region cap 5</span></div></div></div></section><section class="card"><div class="card-head"><h2>Geo intelligence</h2><small>${esc(src.country||'local database')}</small></div><div class="body">${facts([['Country',d.country,src.country],['Country code',d.country_code,src.country_code],['Region / state',d.region,src.region],['City',d.city,src.city],['Timezone',d.timezone,src.timezone],['Coordinates',d.latitude!=null?`${d.latitude}, ${d.longitude}`:'Unknown','local database']])}</div></section><section class="card"><div class="card-head"><h2>Observed behavior</h2><small>normalized access logs</small></div><div class="body">${facts([['First seen',o.first_seen],['Last seen',o.last_seen],['Requests',num(o.requests)],['Unique paths',num(o.unique_paths)],['4xx responses',num(o.status_4xx)],['5xx responses',num(o.status_5xx)],['WP login requests',num(o.wp_login_requests)],['Sensitive probes',num(o.sensitive_probe_requests)]])}<div style="margin-top:16px" class="evidence">${list(o.behavior_evidence)}</div></div></section><section class="card"><div class="card-head"><h2>Evidence trail</h2><small>A / B / C / D</small></div><div class="body"><div class="evidence">${list(c.evidence)}</div></div></section></div><div class="column"><section class="card"><div class="card-head"><h2>Network identity</h2><small>${esc(src.asn||'local database')}</small></div><div class="body">${facts([['ASN',d.asn,src.asn],['Organization',d.organization,src.organization],['IP prefix',d.ip_prefix,src.ip_prefix],['ISP',d.isp,src.isp],['Network type',d.network_type,src.network_type],['Confidence',`${d.organization_confidence||0}%`,'identity evidence']])}</div></section><section class="card"><div class="card-head"><h2>Privacy intelligence</h2><small>${esc(d.privacy_enrichment_status||'unknown')}</small></div><div class="body">${facts([['Tor exit node',yes(d.is_tor),src.is_tor],['VPN',yes(d.is_vpn),src.is_vpn],['Proxy',yes(d.is_proxy),src.is_proxy],['Hosting / datacenter',yes(d.is_hosting),src.is_hosting]])}</div></section><section class="card"><div class="card-head"><h2>Region context</h2><small>${r.country_name?esc(r.country_name):'not available'}</small></div><div class="body">${r.country_name?facts([...(Array.isArray(r.economic_indicators)?r.economic_indicators:Object.values((r.economic_indicators||{}).indicators||{})),...(r.cultural_context||[]),...(r.conflict_indicators||[])].map(x=>[`${x.label||'Context'} · ${x.source||'seed'}`,x.value,x.data_date?`as of ${x.data_date}`:''])):'<div class="state"><strong>No region profile</strong>Country context is not seeded yet.</div>'}</div></section><section class="card"><div class="card-head"><h2>Provider status</h2><small>enrichment visibility</small></div><div class="body"><ul class="sources">${Object.entries(d.provider_status||{}).map(([n,v])=>`<li><span>${esc(n)}</span><em>${esc(v.status)}${v.error?` · ${esc(v.error)}`:''}</em></li>`).join('')||'<li><span>No provider metadata</span><em>unknown</em></li>'}</ul></div></section><section class="card"><div class="card-head"><h2>Identity evidence</h2><small>what data can prove</small></div><div class="body"><div class="evidence">${list(d.identity_evidence)}</div></div></section></div></div>`}catch(e){document.querySelector('#app').innerHTML=`<div class="state"><strong>IP case unavailable</strong>${esc(e.message)}<br><br><a class="button primary" href="/#threats">Return to IP intelligence</a></div>`}}load();
const themeButton=document.createElement('button');themeButton.id='theme-toggle';themeButton.className='theme-float';themeButton.type='button';themeButton.textContent=initialTheme==='dark'?'Light mode':'Dark mode';themeButton.onclick=()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('sentinel-theme',next);themeButton.textContent=next==='dark'?'Light mode':'Dark mode'};document.body.prepend(themeButton);
</script></body></html>
