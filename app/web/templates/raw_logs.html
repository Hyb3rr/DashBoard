<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Raw Log Tail · Sentinel Hub</title><link rel="stylesheet" href="/static/dashboard.css"><link rel="stylesheet" href="/static/sidebar.css">
<style>
  .raw-log-list{display:block;min-height:360px;height:min(62vh,720px);overflow:auto;overscroll-behavior:contain;border:1px solid var(--hairline);border-radius:var(--r-lg);background:var(--console);padding:8px 12px;scrollbar-gutter:stable}
  .raw-log-line{min-height:24px;padding:3px 0;border-bottom:1px solid var(--hairline-soft);color:var(--ink);font:12px/1.5 ui-monospace,SFMono-Regular,monospace;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word}
  .raw-log-ip-token{font-weight:900;color:var(--focus)}
  .raw-log-ip-filter{display:flex;flex-direction:column;gap:5px;min-width:150px}
  .raw-log-ip-combo{position:relative}
  .raw-log-ip-suggestions{position:absolute;z-index:20;top:calc(100% + 4px);left:0;right:0;max-height:240px;overflow:auto;padding:4px;border:1px solid var(--hairline);border-radius:var(--r-sm);background:var(--raised);box-shadow:0 8px 24px rgba(0,0,0,.28)}
  .raw-log-ip-suggestions[hidden]{display:none}
  .raw-log-ip-option{display:block;width:100%;padding:8px 10px;border:0;border-radius:var(--r-sm);background:transparent;color:var(--ink);font:12px ui-monospace,SFMono-Regular,monospace;text-align:left;cursor:pointer}
  .raw-log-ip-option:hover,.raw-log-ip-option[aria-selected="true"]{background:var(--deck);color:var(--focus)}
  .raw-log-ip-empty{padding:8px 10px;color:var(--tertiary);font-size:12px}
  .raw-log-method{font-weight:800}.raw-log-method.get{color:var(--radar)}.raw-log-method.post{color:#b8a2ff}.raw-log-method.put,.raw-log-method.patch{color:var(--watch)}.raw-log-method.delete{color:var(--critical)}.raw-log-method.head,.raw-log-method.options,.raw-log-method.connect,.raw-log-method.trace{color:var(--secondary)}html[data-theme="light"] .raw-log-method.post{color:#6546b3}
  .raw-log-line .raw-log-status-code{display:inline-flex;min-width:0;padding:0 4px;border-radius:3px;font-weight:800;line-height:1.35;vertical-align:baseline}
  .raw-log-line:last-child{border-bottom:0}.raw-log-history-actions{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px;color:var(--tertiary);font:11px ui-monospace,monospace}.raw-log-history-actions button[hidden]{display:none}
  @media(max-width:700px){.raw-log-list{height:58vh;min-height:300px}.raw-log-controls{align-items:stretch;flex-direction:column}.raw-log-actions{align-items:end}.raw-log-actions label:first-child{flex:1}}
</style>
</head>
<body><div class="shell"><aside data-sidebar data-page="raw-logs"></aside>
  <main><header class="topbar"><div><div class="eyebrow">Operations / Raw evidence</div><h1>Raw Log Tail</h1></div><div class="actions"><span class="raw-log-connection" id="raw-log-state"><i></i>Live</span><button id="theme-toggle" class="secondary" type="button">Light mode</button></div></header>
  <section class="raw-log-page" aria-label="Raw log tail"><section class="raw-log-controls"><div><strong>Incoming HTTP events</strong><span>Stored raw events · newest lines at the bottom</span></div><div class="raw-log-actions"><label>History<select id="raw-log-window"><option value="3600">1 hour</option><option value="21600">6 hours</option><option value="43200">12 hours</option><option value="86400">24 hours</option></select></label><div class="raw-log-ip-filter"><label for="raw-log-ip">IP</label><div class="raw-log-ip-combo"><input id="raw-log-ip" type="text" placeholder="All IPs" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="raw-log-ip-suggestions"><div id="raw-log-ip-suggestions" class="raw-log-ip-suggestions" role="listbox" aria-label="IP suggestions" hidden></div></div></div><label>Status<input id="raw-log-status" type="number" min="100" max="599" placeholder="All"></label><button id="raw-log-pause" class="secondary" type="button" aria-pressed="false">Pause</button><button id="raw-log-clear" class="secondary" type="button">Clear filters</button></div></section><div class="raw-log-history-actions"><span id="raw-log-range-status" aria-live="polite">Loading latest events…</span></div><section id="raw-log-list" class="raw-log-list" role="log" aria-live="polite" aria-relevant="additions text"><div class="state">Loading stored raw events…</div></section></section></main>
</div><script src="/static/sidebar.js?v=20260922-sidebar-health"></script><script src="/static/raw-logs.js?v=20260928-raw-clear-filters"></script></body></html>
