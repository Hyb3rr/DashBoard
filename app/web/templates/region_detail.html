<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Region Profile · Sentinel Hub</title>
  <script src="/static/time.js"></script>
  <script>
  // Region detail follows theme selected on dashboard/IP detail.
  document.documentElement.dataset.theme = localStorage.getItem('sentinel-theme') || 'dark';
  </script>
  <script>
  const preLc3Fetch=window.fetch.bind(window);window.fetch=async(...args)=>{const response=await preLc3Fetch(...args);if(String(args[0]).includes('/api/regions/'))response.clone().json().then(data=>{window.__lc3RegionData=data;window.dispatchEvent(new Event('lc3-region-data'))}).catch(()=>{});return response};
  const marketTrackName=track=>track==='woodworking'?'Woodworking':track==='metal_fabrication'?'Metal Fabrication':String(track||'Unknown').replaceAll('_',' ');
  const marketScore=x=>x.calibrated_score??x.raw_local_score;
  const marketReason=value=>value==='insufficient_local_evidence'?'Insufficient local evidence':value==='insufficient_local_hierarchy'?'Insufficient local hierarchy':String(value||'Not available').replaceAll('_',' ');
  const marketPercentile=value=>value==null?'—':`${(Number(value)*100).toFixed(1)}%`;
  const marketLayerMarkup=data=>{const rows=Array.isArray(data?.local_opportunities)?data.local_opportunities:[],overlap=Array.isArray(data?.overlap)?data.overlap:[];const local=rows.length?[...new Set(rows.map(x=>x.track))].map(track=>{const items=rows.filter(x=>x.track===track);return `<section class="card"><header class="card-head"><h2>${esc(marketTrackName(track))}</h2><span class="eyebrow">${items.length.toLocaleString()} precomputed cells</span></header><div class="body"><div class="market-grid">${items.slice(0,12).map(x=>`<article class="market-item"><div class="item-top"><strong>${esc(x.area_name||'Unmapped area')}</strong><span class="market-value">${marketScore(x)==null?'Not scored':Number(marketScore(x)).toFixed(2)}</span></div><p>${esc(x.area_type||'area')} · ${esc(x.h3_cell_id||'—')} · ${x.peer_percentile==null?esc(marketReason(x.missing_reason)):`Peer percentile ${marketPercentile(x.peer_percentile)}`}</p></article>`).join('')}</div>${items.length>12?`<div class="meta">Showing top 12 cells from ${items.length.toLocaleString()} precomputed cells.</div>`:''}</div></section>`}).join(''):'<div class="market-note">No local opportunity data available.</div>';const overlapBlock=data?.overlap_status!=='ready'?`<section class="card"><header class="card-head"><h2>Overlap / Remaining Opportunity</h2><span class="eyebrow">not available</span></header><div class="body"><div class="market-note">Not available · ${esc(marketReason(data?.overlap_unavailable_reason))}</div></div></section>`:overlap.length?`<section class="card"><header class="card-head"><h2>Overlap / Remaining Opportunity</h2><span class="eyebrow">directional · ${overlap.length.toLocaleString()} pairs</span></header><div class="body"><div class="market-grid">${overlap.slice(0,12).map(x=>`<article class="market-item"><strong>${esc(x.area_name_a||'Area A')} ↔ ${esc(x.area_name_b||'Area B')}</strong><p>${esc(marketTrackName(x.track))} · A → B <span class="market-muted">${(Number(x.overlap_a_to_b)*100).toFixed(1)}%</span> · B → A <span class="market-muted">${(Number(x.overlap_b_to_a)*100).toFixed(1)}%</span> · remaining A <span class="market-muted">${(Number(x.remaining_opportunity_a)*100).toFixed(1)}%</span></p></article>`).join('')}</div>${overlap.length>12?'<div class="meta">Showing top 12 directional pairs.</div>':''}</div></section>`:'';return `<div class="market-layers"><section class="card"><header class="card-head"><h2>Local Opportunities</h2><span class="eyebrow">precomputed local evidence</span></header><div class="body">${local}</div></section>${overlapBlock}</div>`};
  </script>
  <style>
  :root{color-scheme:dark;--void:#071014;--console:#0b171c;--raised:#102229;--ink:#e6f1f2;--secondary:#9db2b7;--tertiary:#6f858b;--line:rgba(214,243,247,.1);--cyan:#48c8d8;--green:#55d19a;--yellow:#e8bd61;--red:#e77e76;--r:7px}html[data-theme="light"]{color-scheme:light;--void:#f3f7f8;--console:#fff;--raised:#eaf1f3;--ink:#15252b;--secondary:#49616a;--tertiary:#71848b;--line:rgba(22,54,64,.14);--cyan:#087f91;--green:#087c55;--yellow:#9a6b00;--red:#b3423b}*{box-sizing:border-box}body{margin:0;background:var(--void);color:var(--ink);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}.shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh}aside{padding:20px 14px;border-right:1px solid var(--line)}.brand{display:flex;align-items:center;gap:10px;padding:0 8px 24px}.brand-mark{display:grid;width:32px;height:32px;place-items:center;border:1px solid var(--cyan);border-radius:5px;color:var(--cyan);font-weight:800}.brand small,.meta,.eyebrow{display:block;color:var(--tertiary)}nav{display:grid;gap:4px}.nav{min-height:40px;padding:10px;border-radius:5px;color:var(--secondary);text-decoration:none}.nav:hover,.nav.active{background:var(--raised);color:var(--ink)}main{max-width:1280px;width:100%;padding:40px 48px}.back{display:inline-block;margin-bottom:22px;color:var(--secondary);text-decoration:none}.back:hover{color:var(--cyan)}.hero{display:grid;grid-template-columns:1fr 220px;gap:16px;margin-bottom:16px}.identity,.market,.card{border:1px solid var(--line);border-radius:var(--r);background:var(--console)}.identity{padding:26px}.identity h1{margin:5px 0 7px;font-size:32px;letter-spacing:-.03em}.market{display:grid;padding:22px;place-content:center;text-align:center}.market strong{color:var(--cyan);font:650 48px/1 ui-monospace,monospace;font-variant-numeric:tabular-nums}.market span{margin-top:9px;color:var(--secondary);text-transform:uppercase;letter-spacing:.1em;font-size:11px}.layout{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.column{display:grid;align-content:start;gap:16px}.card-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}.card-head h2{margin:0;font-size:15px}.body{display:grid;gap:10px;padding:18px}.item{padding:13px;border-radius:5px;background:var(--raised)}.item-top{display:flex;align-items:start;justify-content:space-between;gap:12px}.item strong{font-size:13px}.item p{margin:7px 0;color:var(--secondary)}.source{color:var(--tertiary);font-size:11px}.tag{padding:2px 7px;border:1px solid var(--line);border-radius:999px;color:var(--secondary);font:700 10px ui-monospace,monospace}.tag.critical,.tag.high{color:var(--red)}.tag.medium{color:var(--yellow)}.tag.low{color:var(--green)}.effect{color:var(--cyan);font:650 18px ui-monospace,monospace}.source-link{color:var(--cyan);text-decoration:none}.source-link:hover{text-decoration:underline}.state{padding:48px;border:1px solid var(--line);border-radius:var(--r);background:var(--console);color:var(--secondary);text-align:center}.state strong{display:block;margin-bottom:6px;color:var(--ink)}.button{min-height:40px;padding:0 12px;border:1px solid var(--line);border-radius:5px;background:var(--console);color:var(--ink);cursor:pointer}.button:hover{background:var(--raised)}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font:700 11px ui-monospace,monospace}@media(max-width:900px){.shell{display:block}aside{display:none}main{padding:24px}.layout,.hero{grid-template-columns:1fr}.market{place-content:start;text-align:left}.market strong{font-size:36px}}@media(max-width:600px){main{padding:18px}.item-top{display:block}.tag{display:inline-block;margin-top:8px}}
  </style>
  <style>
  .market-layers{display:grid;gap:16px;margin-bottom:16px}.market-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.market-item{padding:13px;border-radius:5px;background:var(--raised)}.market-item p{margin:7px 0 0;color:var(--secondary);font-size:12px}.market-value{color:var(--cyan);font:650 18px ui-monospace,monospace}.market-muted{color:var(--secondary)}.market-note{padding:13px;border:1px dashed var(--line);border-radius:5px;color:var(--secondary)}
  @media(max-width:700px){.market-grid{grid-template-columns:1fr}}
  </style>
  <style>

  .market-overview{display:grid;gap:16px;margin-bottom:16px}.market-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.market-toolbar input{min-height:40px;min-width:240px;padding:0 12px;border:1px solid var(--line);border-radius:5px;background:var(--raised);color:var(--ink)}.market-filter{min-height:40px;padding:0 12px;border:1px solid var(--line);border-radius:5px;background:var(--console);color:var(--secondary);cursor:pointer}.market-filter.active{border-color:var(--cyan);color:var(--cyan)}.market-summary-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.market-summary{padding:16px;border-radius:6px;background:var(--raised)}.market-summary h3{margin:0 0 10px;font-size:16px}.market-stat{display:flex;justify-content:space-between;gap:12px;color:var(--secondary);font-size:12px}.market-stat strong{color:var(--cyan);font:650 18px ui-monospace,monospace}.market-summary details{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}.market-summary summary{cursor:pointer;color:var(--cyan);font-size:12px}.market-evidence{display:grid;gap:6px;margin-top:10px}.market-evidence .item{padding:9px}.market-empty{padding:16px;border:1px dashed var(--line);border-radius:6px;color:var(--secondary)}
  @media(max-width:700px){.market-summary-grid{grid-template-columns:1fr}.market-toolbar input{min-width:100%}}
  .lc3-context{margin:0 0 16px;padding:16px;border:1px solid var(--line);border-radius:6px;background:var(--raised)}.lc3-context h3,.lc3-why h4{margin:0 0 10px;font-size:14px}.lc3-context-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.lc3-context-item,.lc3-why{padding:10px;border-radius:5px;background:var(--console)}.lc3-context-item span,.lc3-why p{display:block;color:var(--secondary);font-size:12px}.lc3-context-item strong{display:block;margin-top:4px;color:var(--cyan);font:650 16px ui-monospace,monospace}.lc3-why{margin:0 0 12px}.lc3-why p{margin:0}.lc3-why ul{margin:8px 0 0;padding-left:18px;color:var(--secondary);font-size:12px}@media(max-width:700px){.lc3-context-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="shell">
    <aside>
      <div class="brand">
        <div class="brand-mark">
          S
        </div>
        <div>
          <strong>Sentinel Hub</strong><small>remote monitor</small>
        </div>
      </div>
      <nav>
        <a class="nav" href="/">⌁ Overview</a><a class="nav" href="/#threats">◎ IP Intelligence</a><a class="nav" href="/alerts">! Alerts</a><a class="nav active" href="/regions">◇ Region profiles</a>
      </nav>
    </aside>
    <main id="app">
      <div class="state">
        <strong>Loading region profile…</strong>Reading local context and provenance.
      </div>
    </main>
  </div>
  <script>
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const marketStatus=r=>r.market_score!=null?`<strong>${esc(r.market_score)}</strong><span>${esc(r.market_level||'unknown')} market score · ${esc(r.trade_data_year||'unknown')} · ${esc(r.trade_data_method==='mirror'?'mirror':'reported')} · ${esc(r.trade_confidence||'unknown')} confidence</span>`:`<strong>Not scored</strong><span>${esc(r.missing_reason==='insufficient_economic_data'?'Insufficient economic data':r.missing_reason==='insufficient_trade_data'?'Insufficient trade data':'Data unavailable')} · ${esc(r.missing_reason||'unavailable')}</span>`;const code=decodeURIComponent(location.pathname.split('/').filter(Boolean).pop()).toUpperCase(),app=document.querySelector('#app');const sourceLine=x=>`${esc(x.source||'Unknown source')}${x.date||x.data_date?` · ${esc(x.date||x.data_date)}`:''}`;function indicatorItems(items){return Array.isArray(items)?items:Object.values(items?.indicators||{});}function indicators(items,type){items=indicatorItems(items);return items?.length?items.map(x=>`<article class="item"><div class="item-top"><strong>${esc(x.label||x.type||type)}</strong>${type==='conflict'?`<span class="tag ${esc(x.severity||'')}">${esc(x.severity||'unknown')}</span>`:''}</div><p>${esc(x.description||x.value||'Unknown')}</p><div class="source">${sourceLine(x)}</div></article>`).join(''):'<div class="meta">No data available.</div>'}async function load(){try{const response=await fetch('/api/regions/'+encodeURIComponent(code),{cache:'no-store'});if(!response.ok)throw Error(response.status===404?'Region profile not found':`HTTP ${response.status}`);const r=await response.json();document.title=`${r.country_name} · Region Profile`;app.innerHTML=`<a class="back" href="/regions">← All region profiles</a><section class="hero"><div class="identity"><div class="eyebrow">${esc(r.country_code)} · sourced country context</div><h1>${esc(r.country_name)}</h1><div class="meta">${Number(r.observed_ip_count||0).toLocaleString()} observed IPs · updated ${vnTime(r.updated_at)}</div></div><div class="market">${marketStatus(r)}</div></section><div class="layout"><div class="column"><section class="card"><header class="card-head"><h2>Economic indicators</h2><span class="eyebrow">commercial context</span></header><div class="body">${indicators(r.economic_indicators,'economic')}</div></section><section class="card"><header class="card-head"><h2>Conflict indicators</h2><span class="eyebrow">normalized</span></header><div class="body">${indicators(r.conflict_indicators,'conflict')}</div></section></div><div class="column"><section class="card"><header class="card-head"><h2>Market components</h2><span class="eyebrow">weighted score</span></header><div class="body">${Object.entries(r.market_components||{}).map(([key,value])=>`<article class="item"><div class="item-top"><strong>${esc(key.replaceAll("_"," "))}</strong><span class="effect">${value==null?"—":esc(Math.round(value))}</span></div></article>`).join("")}</div></section><section class="card"><header class="card-head"><h2>Woodworking machinery imports</h2><span class="eyebrow">2018–2025</span></header><div class="body">${(r.economic_indicators?.trade?.woodworking_machinery?.series||[]).map(x=>`<article class="item"><div class="item-top"><strong>${esc(x.year)}</strong><span class="effect">${esc(x.value)}</span></div></article>`).join("")}</div></section><section class="card"><header class="card-head"><h2>Product opportunities</h2><span class="eyebrow">sub-HS mix</span></header><div class="body">${(r.product_opportunities||[]).map(x=>`<article class="item"><div class="item-top"><strong>${esc(x.product||x.hs_code)}</strong><span class="effect">${esc(x.score)}</span></div><p>${esc(x.hs_code)} · ${esc(x.level||"unknown")}</p></article>`).join("")}</div></section><section class="card"><header class="card-head"><h2>Market score evidence</h2><span class="eyebrow">market components</span></header><div class="body">${(r.market_evidence||[]).length?r.market_evidence.map(x=>`<article class="item"><div class="item-top"><strong>${esc(x.signal.replaceAll('_',' '))}</strong><span class="effect">+${esc(x.effect)}</span></div><p>${esc(x.value??x.raw_value??x.percentile??'—')} · ${esc(x.points??x.percentile??'—')} points × ${esc(x.weight??'—')}</p><div class="source">${sourceLine(x)}</div></article>`).join(''):'<div class="meta">Market score unavailable.</div>'}</div></section><section class="card"><header class="card-head"><h2>Sources</h2><span class="eyebrow">provenance</span></header><div class="body">${(r.sources||[]).length?r.sources.map(x=>`<article class="item"><div class="item-top"><strong>${esc(x.name||'Unknown')}</strong><span class="tag">${esc(x.type||'source')}</span></div>${x.url?`<p><a class="source-link" href="${esc(x.url)}" rel="noreferrer">Open source reference</a></p>`:''}</article>`).join(''):'<div class="meta">No source metadata available.</div>'}</div></section></div></div>`}catch(error){app.innerHTML=`<a class="back" href="/regions">← All region profiles</a><div class="state"><strong>Region profile unavailable</strong>${esc(error.message)}</div>`}}load();
  </script> 
  <script>

  // Keep already-open region detail synchronized if another app page changes theme.
  window.addEventListener('storage', (event) => {
    if (event.key === 'sentinel-theme' && event.newValue) {
      document.documentElement.dataset.theme = event.newValue;
    }
  });
  </script>
  <script>

  const formatRegionNumber=value=>{const n=Number(value);return Number.isFinite(n)?n.toLocaleString('en-US',{maximumFractionDigits:2}).replace(/,/g,' '):value};
  const formatRegionDetailNumbers=()=>document.querySelectorAll('.market strong,.effect,.item p').forEach(node=>{const text=node.firstChild;if(!text||text.nodeType!==3)return;const value=text.nodeValue.trim();if(node.matches('.item p')&&!/^[+-]?(?:\d+(?:\.\d+)?|\.\d+)$/.test(value))return;text.nodeValue=formatRegionNumber(value)});
  new MutationObserver(formatRegionDetailNumbers).observe(document.querySelector('#app'),{childList:true,subtree:true});
  </script>
  <script>
  const lc3Esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const lc3Track=v=>v==='woodworking'?'Woodworking':v==='metal_fabrication'?'Metal Fabrication':String(v||'').replaceAll('_',' ');
  const lc3Score=x=>x?.area_calibrated_score??x?.city_calibrated_score??x?.area_raw_score??x?.city_raw_score;
  const lc3Percentile=x=>x==null?'—':`${(Number(x)*100).toFixed(1)}%`;
  const lc3Evidence=(rows,areaId)=>rows.filter(x=>x.area_id===areaId).slice(0,20).map(x=>`<div class="item"><div class="item-top"><strong>${lc3Esc(x.h3_cell_id)}</strong><span class="effect">${x.raw_local_score==null?'Not scored':Number(x.raw_local_score).toFixed(2)}</span></div><p>${lc3Esc(x.evidence_status||'unknown')}</p></div>`).join('');
  const lc3Card=(x,kind,rows)=>{const score=lc3Score(x), name=kind==='city'?x.city_name:x.area_name, id=kind==='city'?x.city_id:x.area_id;const evidence=kind==='area'?lc3Evidence(rows,id):'';return `<article class="market-summary" data-market-name="${lc3Esc(name)}" data-market-track="${lc3Esc(x.track)}"><h3>${lc3Esc(name||'Unnamed area')}</h3><div class="market-stat"><span>Opportunity</span><strong>${score==null?'Not scored':Number(score).toFixed(2)}</strong></div><div class="market-stat"><span>Peer percentile</span><span>${lc3Percentile(x.area_percentile??x.city_percentile)}</span></div><div class="market-stat"><span>Evidence coverage</span><span>${x.evidence_coverage==null?'—':`${(Number(x.evidence_coverage)*100).toFixed(1)}%`}</span></div><div class="market-stat"><span>Cells</span><span>${Number(x.total_cells||0).toLocaleString()}</span></div>${evidence?`<details><summary>Show supporting H3 evidence</summary><div class="market-evidence">${evidence}</div></details>`:''}</article>`};
  const lc3Render=data=>{const areas=Array.isArray(data?.area_opportunities)?data.area_opportunities:[],cities=Array.isArray(data?.city_opportunities)?data.city_opportunities:[],rows=Array.isArray(data?.local_opportunities)?data.local_opportunities:[];if(!areas.length&&!cities.length)return '<section class="card market-overview"><header class="card-head"><h2>Local Opportunities</h2></header><div class="body"><div class="market-empty">No persisted area or city summary is available yet.</div></div></section>';return `<section class="card market-overview"><header class="card-head"><h2>Local Opportunities</h2><span class="eyebrow">persisted area and urban-centre summaries</span></header><div class="body"><div class="market-toolbar"><input id="market-search" type="search" placeholder="Search area or city" aria-label="Search area or city"><button class="market-filter active" data-track="all" type="button">All</button><button class="market-filter" data-track="woodworking" type="button">Woodworking</button><button class="market-filter" data-track="metal_fabrication" type="button">Metal Fabrication</button></div><section class="market-overview" data-market-section="areas"><header class="card-head"><h2>Top Areas</h2><span class="eyebrow">${areas.length.toLocaleString()} summaries</span></header><div class="market-summary-grid">${areas.map(x=>lc3Card(x,'area',rows)).join('')}</div></section><section class="market-overview" data-market-section="cities"><header class="card-head"><h2>Cities / Urban Centres</h2><span class="eyebrow">${cities.length?`${cities.length.toLocaleString()} summaries`:'unavailable'}</span></header><div class="market-summary-grid">${cities.length?cities.map(x=>lc3Card(x,'city',rows)).join(''):`<div class="market-empty">City score unavailable: ${lc3Esc(data?.city_unavailable_reason||'insufficient_city_summary')}</div>`}</div></section></div></section>`};
  const lc3Install=data=>{document.querySelectorAll('.market-layers').forEach(x=>x.remove());document.querySelectorAll('.market-overview').forEach(x=>{if(x.closest('.market-layers'))x.remove()});const hero=document.querySelector('.hero');if(!hero||document.querySelector('.market-overview'))return;hero.insertAdjacentHTML('afterend',lc3Render(data));const root=document.querySelector('.market-overview');const search=root.querySelector('#market-search');const filters=[...root.querySelectorAll('.market-filter')];const apply=()=>{const q=(search.value||'').toLowerCase();const active=filters.find(x=>x.classList.contains('active'))?.dataset.track||'all';root.querySelectorAll('.market-summary').forEach(card=>{const okName=card.dataset.marketName.toLowerCase().includes(q),okTrack=active==='all'||card.dataset.marketTrack===active;card.hidden=!(okName&&okTrack)});};search.addEventListener('input',apply);filters.forEach(button=>button.addEventListener('click',()=>{filters.forEach(x=>x.classList.remove('active'));button.classList.add('active');apply()}))};
  const lc3Fetch=window.fetch.bind(window);window.fetch=async(...args)=>{const response=await lc3Fetch(...args);if(String(args[0]).includes('/api/regions/'))response.clone().json().then(lc3Install).catch(()=>{});return response};
  const lc3Upgrade=()=>{if(window.__lc3RegionData&&document.querySelector('.hero'))lc3Install(window.__lc3RegionData)};window.addEventListener('lc3-region-data',lc3Upgrade);new MutationObserver(lc3Upgrade).observe(document.querySelector('#app'),{childList:true,subtree:true});
  </script> 
  <script>

  const lc3GroupCities=()=>{const grid=document.querySelector('[data-market-section="cities"] .market-summary-grid');if(!grid||grid.dataset.grouped==='true')return;const cards=[...grid.querySelectorAll('.market-summary')];if(!cards.length)return;const groups=new Map();cards.forEach(card=>{const name=card.querySelector('h3')?.textContent||'Unnamed city';const list=groups.get(name)||[];list.push(card);groups.set(name,list)});if([...groups.values()].every(list=>list.length<2)){grid.dataset.grouped='true';return}grid.innerHTML='';groups.forEach((cards,name)=>{const card=document.createElement('article');card.className='market-summary';card.dataset.marketName=name;card.dataset.marketTrack='all';card.innerHTML=`<h3>${lc3Esc(name)}</h3>${cards.map(item=>{const track=lc3Track(item.dataset.marketTrack),stats=[...item.querySelectorAll('.market-stat')].map(x=>x.outerHTML).join('');return `<div class="city-track"><strong>${lc3Esc(track)}</strong>${stats}</div>`}).join('')}`;grid.appendChild(card)});grid.dataset.grouped='true'};
  new MutationObserver(lc3GroupCities).observe(document.querySelector('#app'),{childList:true,subtree:true});
  </script> 
  <script>

  const lc3ApplyCityFilters=()=>{const grid=document.querySelector('[data-market-section="cities"] .market-summary-grid');if(!grid||grid.dataset.grouped!=='true')return;const search=document.querySelector('#market-search'),active=document.querySelector('.market-filter.active')?.dataset.track||'all',query=(search?.value||'').toLowerCase();grid.querySelectorAll('.market-summary').forEach(card=>{const name=(card.dataset.marketName||'').toLowerCase();const tracks=[...card.querySelectorAll('.city-track strong')].map(x=>x.textContent.toLowerCase().replaceAll(' ','_'));card.hidden=!(name.includes(query)&&(active==='all'||tracks.includes(active)))});if(grid.dataset.filtersBound==='true')return;grid.dataset.filtersBound='true';search?.addEventListener('input',lc3ApplyCityFilters);document.querySelectorAll('.market-filter').forEach(button=>button.addEventListener('click',()=>queueMicrotask(lc3ApplyCityFilters)))};
  new MutationObserver(lc3ApplyCityFilters).observe(document.querySelector('#app'),{childList:true,subtree:true});
  const lc3Explain=()=>{const data=window.__lc3RegionData,root=document.querySelector('.market-overview');if(!data||!root)return;if(!root.querySelector('.lc3-context')){const components=data.market_components||{};const latest=data.economic_indicators?.trade?.woodworking_machinery?.series?.at(-1);const context=document.createElement('section');context.className='lc3-context';context.innerHTML=`<h3>${lc3Esc(data.country_name||'Country')} market context</h3><div class="lc3-context-grid"><div class="lc3-context-item"><span>Economic potential · country level</span><strong>${components.economic_potential==null?'Not available':Number(components.economic_potential).toFixed(1)}</strong></div><div class="lc3-context-item"><span>Woodworking demand · country level</span><strong>${components.product_demand==null?'Not available':Number(components.product_demand).toFixed(1)}</strong></div><div class="lc3-context-item"><span>Latest machinery imports · country level</span><strong>${latest?`${Number(latest.value).toLocaleString()} (${latest.year})`:'Not available'}</strong></div></div>`;root.querySelector('.market-toolbar')?.after(context)}root.querySelectorAll('[data-market-section="areas"] .market-summary,[data-market-section="cities"] .market-summary').forEach(card=>{if(card.querySelector('.lc3-why'))return;const stats=[...card.querySelectorAll('.market-stat')].map(x=>x.textContent.replace(/\\s+/g,' ').trim());const why=document.createElement('div');why.className='lc3-why';why.innerHTML=`<h4>Why this area?</h4><p>Local fit is based on persisted geography and opportunity evidence. ${lc3Esc(stats.filter(x=>x.startsWith('Evidence coverage')).join(' · ')||'Evidence coverage is shown per track.')}</p>`;card.querySelector('h3')?.after(why)})};
  new MutationObserver(lc3Explain).observe(document.querySelector('#app'),{childList:true,subtree:true});
  </script>
</body>
