<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Region Profile · Sentinel Hub</title>
  <script>
  const productLabel=value=>({drilling_morticing:'Drilling & morticing',splitting_slicing:'Splitting & slicing',bending_assembling:'Bending & assembling',multi_operation:'Multi-operation',other_woodworking_machines:'Other woodworking machines'}[String(value||'').toLowerCase()]||String(value||'').replaceAll('_',' '));
  const prettyNumber=value=>{if(value==null||value==='')return '—';const n=Number(value);return Number.isFinite(n)?n.toFixed(2):String(value)};
  </script>
  <script src="/static/time.js"></script>
  <script>
  // Region detail follows theme selected on dashboard/IP detail.
  document.documentElement.dataset.theme = localStorage.getItem('sentinel-theme') || 'dark';
  </script>
  <script>
  const preLc3Fetch=window.fetch.bind(window);window.fetch=async(...args)=>{const response=await preLc3Fetch(...args);if(String(args[0]).includes('/api/regions/'))response.clone().json().then(data=>{window.__lc3RegionData=data;window.dispatchEvent(new Event('lc3-region-data'))}).catch(()=>{});return response};
  </script>
  <style>
  :root{color-scheme:dark;--void:#071014;--console:#0b171c;--raised:#102229;--ink:#e6f1f2;--secondary:#9db2b7;--tertiary:#6f858b;--line:rgba(214,243,247,.1);--cyan:#48c8d8;--green:#55d19a;--yellow:#e8bd61;--red:#e77e76;--r:7px}html[data-theme="light"]{color-scheme:light;--void:#f3f7f8;--console:#fff;--raised:#eaf1f3;--ink:#15252b;--secondary:#49616a;--tertiary:#71848b;--line:rgba(22,54,64,.14);--cyan:#087f91;--green:#087c55;--yellow:#9a6b00;--red:#b3423b}*{box-sizing:border-box}body{margin:0;background:var(--void);color:var(--ink);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}.shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh}aside{padding:20px 14px;border-right:1px solid var(--line)}.brand{display:flex;align-items:center;gap:10px;padding:0 8px 24px}.brand-mark{display:grid;width:32px;height:32px;place-items:center;border:1px solid var(--cyan);border-radius:5px;color:var(--cyan);font-weight:800}.brand small,.meta,.eyebrow{display:block;color:var(--tertiary)}nav{display:grid;gap:4px}.nav{min-height:40px;padding:10px;border-radius:5px;color:var(--secondary);text-decoration:none}.nav:hover,.nav.active{background:var(--raised);color:var(--ink)}main{max-width:1280px;width:100%;padding:40px 48px}.back{display:inline-block;margin-bottom:22px;color:var(--secondary);text-decoration:none}.back:hover{color:var(--cyan)}.hero{display:grid;grid-template-columns:1fr 220px;gap:16px;margin-bottom:16px}.identity,.market,.card{border:1px solid var(--line);border-radius:var(--r);background:var(--console)}.identity{padding:26px}.identity h1{margin:5px 0 7px;font-size:32px;letter-spacing:-.03em}.market{display:grid;padding:22px;place-content:center;text-align:center}.market strong{color:var(--cyan);font:650 48px/1 ui-monospace,monospace;font-variant-numeric:tabular-nums}.market span{margin-top:9px;color:var(--secondary);text-transform:uppercase;letter-spacing:.1em;font-size:11px}.layout{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.column{display:grid;align-content:start;gap:16px}.card-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}.card-head h2{margin:0;font-size:15px}.body{display:grid;gap:10px;padding:18px}.item{padding:13px;border-radius:5px;background:var(--raised)}.item-top{display:flex;align-items:start;justify-content:space-between;gap:12px}.item strong{font-size:13px}.item p{margin:7px 0;color:var(--secondary)}.source{color:var(--tertiary);font-size:11px}.tag{padding:2px 7px;border:1px solid var(--line);border-radius:999px;color:var(--secondary);font:700 10px ui-monospace,monospace}.tag.critical,.tag.high{color:var(--red)}.tag.medium{color:var(--yellow)}.tag.low{color:var(--green)}.effect{color:var(--cyan);font:650 18px ui-monospace,monospace}.source-link{color:var(--cyan);text-decoration:none}.source-link:hover{text-decoration:underline}.state{padding:48px;border:1px solid var(--line);border-radius:var(--r);background:var(--console);color:var(--secondary);text-align:center}.state strong{display:block;margin-bottom:6px;color:var(--ink)}.button{min-height:40px;padding:0 12px;border:1px solid var(--line);border-radius:5px;background:var(--console);color:var(--ink);cursor:pointer}.button:hover{background:var(--raised)}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font:700 11px ui-monospace,monospace}@media(max-width:900px){.shell{display:block}aside{display:none}main{padding:24px}.layout,.hero{grid-template-columns:1fr}.market{place-content:start;text-align:left}.market strong{font-size:36px}}@media(max-width:600px){main{padding:18px}.item-top{display:block}.tag{display:inline-block;margin-top:8px}}
  #app [hidden]{display:none!important}.market-summary-label{display:block;color:var(--tertiary);font-size:10px;text-transform:uppercase;letter-spacing:.12em}.market-summary-note{display:block;margin-top:8px;color:var(--secondary);font-size:12px;line-height:1.4}
  </style>

<body>
  <div class="shell">
    <aside>
      <div class="brand">
        <div class="brand-mark">
          S
        </div>
        <div>
          <strong>Sentinel Hub</strong><small>remote monitor</small>
        </div>
      </div>
      <nav>
        <a class="nav" href="/"><span>⌁</span> Overview</a><a class="nav" href="/#threats"><span>◎</span> IP Intelligence</a><a class="nav" href="/alerts"><span>!</span> Alerts</a><a class="nav" href="/raw-logs"><span>≋</span> Raw Log Tail</a><a class="nav active" href="/regions"><span>◇</span> Region profiles</a>

  <script>
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const marketStatus=r=>r.market_score!=null?`<strong>${esc(r.market_score)}</strong><span>${esc(r.market_level||'unknown')} market score · ${esc(r.trade_data_year||'unknown')} · ${esc(r.trade_data_method==='mirror'?'mirror':'reported')} · ${esc(r.trade_confidence||'unknown')} confidence</span>`:`<strong>Not scored</strong><span>${esc(r.missing_reason==='insufficient_economic_data'?'Insufficient economic data':r.missing_reason==='insufficient_trade_data'?'Insufficient trade data':'Data unavailable')} · ${esc(r.missing_reason||'unavailable')}</span>`;const code=decodeURIComponent(location.pathname.split('/').filter(Boolean).pop()).toUpperCase(),app=document.querySelector('#app');const sourceLine=x=>`${esc(x.source||'Unknown source')}${x.date||x.data_date?` · ${esc(x.date||x.data_date)}`:''}`;function indicatorItems(items){return Array.isArray(items)?items:Object.values(items?.indicators||{});}function indicators(items,type){items=indicatorItems(items);return items?.length?items.map(x=>`<article class="item"><div class="item-top"><strong>${esc(x.label||x.type||type)}</strong>${type==='conflict'?`<span class="tag ${esc(x.severity||'')}">${esc(x.severity||'unknown')}</span>`:''}</div><p>${esc(x.description||x.value||'Unknown')}</p><div class="source">${sourceLine(x)}</div></article>`).join(''):'<div class="meta">No data available.</div>'}async function load(){try{const response=await fetch('/api/regions/'+encodeURIComponent(code),{cache:'no-store'});if(!response.ok)throw Error(response.status===404?'Region profile not found':`HTTP ${response.status}`);const r=await response.json();document.title=`${r.country_name} · Region Profile`;app.innerHTML=`<a class="back" href="/regions">← All region profiles</a><section class="hero"><div class="identity"><div class="eyebrow">${esc(r.country_code)} · sourced country context</div><h1>${esc(r.country_name)}</h1><div class="meta">${Number(r.observed_ip_count||0).toLocaleString()} observed IPs · updated ${vnTime(r.updated_at)}</div></div><div class="market">${marketStatus(r)}</div></section><div class="layout"><div class="column"><section class="card"><header class="card-head"><h2>Economic indicators</h2><span class="eyebrow">commercial context</span></header><div class="body">${indicators(r.economic_indicators,'economic')}</div></section><section class="card"><header class="card-head"><h2>Conflict indicators</h2><span class="eyebrow">normalized</span></header><div class="body">${indicators(r.conflict_indicators,'conflict')}</div></section></div><div class="column"><section class="card"><header class="card-head"><h2>Market components</h2><span class="eyebrow">weighted score</span></header><div class="body">${Object.entries(r.market_components||{}).map(([key,value])=>`<article class="item"><div class="item-top"><strong>${esc(key.replaceAll("_"," "))}</strong><span class="effect">${value==null?"—":esc(Math.round(value))}</span></div></article>`).join("")}</div></section><section class="card"><header class="card-head"><h2>Woodworking machinery imports</h2><span class="eyebrow">2018–2025</span></header><div class="body">${(r.economic_indicators?.trade?.woodworking_machinery?.series||[]).map(x=>`<article class="item"><div class="item-top"><strong>${esc(x.year)}</strong><span class="effect">${esc(x.value)}</span></div></article>`).join("")}</div></section><section class="card"><header class="card-head"><h2>Product opportunities</h2><span class="eyebrow">sub-HS mix</span></header><div class="body">${(r.product_opportunities||[]).map(x=>`<article class="item"><div class="item-top"><strong>${esc(x.product||x.hs_code)}</strong><span class="effect">${esc(x.score)}</span></div><p>${esc(x.hs_code)} · ${esc(x.level||"unknown")}</p></article>`).join("")}</div></section><section class="card"><header class="card-head"><h2>Market score evidence</h2><span class="eyebrow">market components</span></header><div class="body">${(r.market_evidence||[]).length?r.market_evidence.map(x=>`<article class="item"><div class="item-top"><strong>${esc(x.signal.replaceAll('_',' '))}</strong><span class="effect">+${esc(x.effect)}</span></div><p>${esc(x.value??x.raw_value??x.percentile??'—')} · ${esc(x.points??x.percentile??'—')} points × ${esc(x.weight??'—')}</p><div class="source">${sourceLine(x)}</div></article>`).join(''):'<div class="meta">Market score unavailable.</div>'}</div></section><section class="card"><header class="card-head"><h2>Sources</h2><span class="eyebrow">provenance</span></header><div class="body">${(r.sources||[]).length?r.sources.map(x=>`<article class="item"><div class="item-top"><strong>${esc(x.name||'Unknown')}</strong><span class="tag">${esc(x.type||'source')}</span></div>${x.url?`<p><a class="source-link" href="${esc(x.url)}" rel="noreferrer">Open source reference</a></p>`:''}</article>`).join(''):'<div class="meta">No source metadata available.</div>'}</div></section></div></div>`}catch(error){app.innerHTML=`<a class="back" href="/regions">← All region profiles</a><div class="state"><strong>Region profile unavailable</strong>${esc(error.message)}</div>`}}load();
  const decorateRegionDetail=()=>{const market=document.querySelector('.market');if(market&&!market.dataset.summaryReady){const score=market.querySelector('strong');if(score){market.dataset.summaryReady='true';const label=document.createElement('span');label.className='market-summary-label';label.textContent='Market opportunity';market.prepend(label);const note=document.createElement('span');note.className='market-summary-note';const value=Number(score.textContent);note.textContent=Number.isFinite(value)?(value>=75?'Strong commercial context; review product and local evidence below.':value>=50?'Promising context; compare evidence before prioritizing.':'Limited published context; treat as exploratory.'):'Review available evidence below.';market.append(note)}}document.querySelectorAll('.card').forEach(card=>{if(card.querySelector('h2')?.textContent==='Product opportunities')card.querySelectorAll('.item strong').forEach(node=>{node.textContent=productLabel(node.textContent)});if(card.querySelector('h2')?.textContent==='Market score evidence')card.querySelectorAll('.item p').forEach(node=>{node.textContent=node.textContent.replace(/\d+\.\d+/g,value=>prettyNumber(value))})})};
  </script> 
  <script>

  // Keep already-open region detail synchronized if another app page changes theme.
  window.addEventListener('storage', (event) => {
    if (event.key === 'sentinel-theme' && event.newValue) {
      document.documentElement.dataset.theme = event.newValue;
    }
  });
  </script>
  <script>

  const formatRegionNumber=value=>{const n=Number(value);return Number.isFinite(n)?n.toLocaleString('en-US',{maximumFractionDigits:2}).replace(/,/g,' '):value};
  const formatRegionDetailNumbers=()=>document.querySelectorAll('.market strong,.effect,.item p').forEach(node=>{const text=node.firstChild;if(!text||text.nodeType!==3)return;const value=text.nodeValue.trim();if(node.matches('.item p')&&!/^[+-]?(?:\d+(?:\.\d+)?|\.\d+)$/.test(value))return;text.nodeValue=formatRegionNumber(value)});
  const decorateRegionNumbers=()=>formatRegionDetailNumbers();
  </script>
<style id="province-profile-tabs-style">.region-scope-tabs{display:flex;gap:8px;margin:18px 0}.region-scope-tabs button{padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:var(--console);color:var(--ink);cursor:pointer}.region-scope-tabs button[aria-selected="true"]{background:var(--cyan);color:#fff}.province-profile{margin:0 0 16px}.province-decision-toolbar{display:flex;gap:12px;align-items:end;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line)}.province-decision-toolbar label{display:grid;gap:5px;color:var(--tertiary);font-size:10px;text-transform:uppercase}.province-decision-toolbar select,.province-decision-toolbar input{min-height:36px;padding:0 10px;background:var(--raised);border:1px solid var(--line);color:var(--ink);border-radius:5px}.province-decision-note{margin:14px 18px;color:var(--secondary);font-size:12px}.province-card-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:0 18px 18px}.province-decision-card{padding:15px;border:1px solid var(--line);border-radius:8px;background:var(--raised)}.province-card-head{display:flex;justify-content:space-between;gap:12px;align-items:start}.province-card-head h3{margin:0 0 3px}.province-base{display:block;margin:16px 0 12px;font-size:16px}.province-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;color:var(--tertiary);font-size:10px;text-transform:uppercase}.province-metrics b{display:block;margin-top:4px;color:var(--ink);font-size:12px;text-transform:none}.province-why{min-height:32px;color:var(--secondary);font-size:12px}.province-details{padding:7px 10px;border:1px solid var(--line);border-radius:5px;background:transparent;color:var(--cyan);cursor:pointer}.tier{display:inline-block;padding:4px 7px;border-radius:4px;font-size:10px;font-weight:700;letter-spacing:.04em;white-space:nowrap}.tier.high{background:#d9f4e8;color:#087443}.tier.moderate{background:#fff0cc;color:#8a5b00}.tier.limited{background:#e8edf1;color:#50616b}.tier.unknown{background:#eef0f2;color:#68757c}.province-compare{overflow:auto;padding:0 18px 18px}.province-compare table{width:100%;border-collapse:collapse;font-size:12px}.province-compare th,.province-compare td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.province-compare th{color:var(--tertiary);font-size:10px;text-transform:uppercase}.province-show-all{display:block;margin:0 auto 18px;padding:8px 12px;border:1px solid var(--line);border-radius:5px;background:transparent;color:var(--cyan);cursor:pointer}.value{color:var(--cyan);font-family:ui-monospace,monospace}.unknown{color:var(--tertiary);font-style:italic}@media(max-width:700px){.province-card-grid{grid-template-columns:1fr}.province-metrics{grid-template-columns:1fr 1fr}.province-profile{overflow-x:auto}}
</style>
<script>
const provinceEsc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const provinceVal=(v,u='')=>v==null?'<span class="unknown">Not available</span>':`<span class="value">${provinceEsc(Number(v).toLocaleString('en-US',{maximumFractionDigits:2}))}${u?' '+u:''}</span>`;
const provinceTier=(value,values)=>{
  if(value==null)return {label:'INSUFFICIENT DATA',className:'unknown'};
  const sorted=values.filter(v=>v!=null).sort((a,b)=>a-b),rank=sorted.findIndex(v=>v>=value);
  const pct=sorted.length<2?1:rank/(sorted.length-1);
  if(pct>=.75)return {label:'HIGH OBSERVED BASE',className:'high'};
  if(pct>=.25)return {label:'MODERATE OBSERVED BASE',className:'moderate'};
  return {label:'LIMITED OBSERVED BASE',className:'limited'};
};
const installProvinceTabs=data=>{
  if(data?.country_code!=='VN'||document.querySelector('.region-scope-tabs'))return;
  const app=document.querySelector('#app'),hero=app.querySelector('.hero'),profile=data.province_profile;
  if(!profile)return;
  const rows=(profile.provinces||[]).map(row=>{
    const tracks=row.relevant_enterprises?.tracks||{}, f=row.province_investment_momentum||{}, stock=f.cumulative_stock||{};
    const overall=row.city_overall_opportunity||{};
    return {row,name:row.province_name||'Unknown',wood:tracks.woodworking?.value??null,metal:tracks.metalworking?.value??null,iip:row.manufacturing_activity?.iip??null,fdiflow:f.current_period?.value??null,stock:stock.value??null,overall:overall.score??null,coverage:overall.evidence_coverage??null};
  });
  const woodValues=rows.map(x=>x.wood),metalValues=rows.map(x=>x.metal);
  const tabs=document.createElement('div');tabs.className='region-scope-tabs';
  tabs.innerHTML='<button type="button" role="tab" aria-selected="true" data-scope="national">National context</button><button type="button" role="tab" aria-selected="false" data-scope="province">Province / city profiles</button>';
  hero.after(tabs);
  const section=document.createElement('section');section.className='card province-profile';section.hidden=true;
  section.innerHTML='<header class="card-head"><h2>Province / city profiles</h2><span class="eyebrow">Overall opportunity with source evidence</span></header><div class="province-decision-toolbar"><label>Product <select id="province-product"><option value="wood">Woodworking</option><option value="metal">Metalworking</option><option value="compare">Compare all</option></select></label><label>Sort by <select id="province-sort"><option value="overall">Overall opportunity</option><option value="base">Observed enterprise base</option><option value="iip">IIP momentum</option><option value="fdi">FDI flow</option></select></label><input id="province-search" type="search" placeholder="Search province" aria-label="Search province"></div><p class="province-decision-note">Overall opportunity is the authoritative city/province score; product signals and indicators explain its evidence.</p><div class="province-results"></div><button type="button" class="province-show-all" hidden>Show all 34 provinces</button>';
  tabs.after(section);
  const results=section.querySelector('.province-results'), search=section.querySelector('#province-search'), product=section.querySelector('#province-product'), sort=section.querySelector('#province-sort'), showAll=section.querySelector('.province-show-all');
  let expanded=false;
  const fmt=(v,unit='')=>v==null?'<span class="unknown">Not available</span>':`<span class="value">${Number(v).toLocaleString('en-US',{maximumFractionDigits:2})}${unit?' '+unit:''}</span>`;
  const moneyB=v=>{if(v==null)return '<span class="unknown">Not available</span>';const n=Number(v);if(Math.abs(n)<10)return `<span class="value">$${n.toLocaleString('en-US',{maximumFractionDigits:2})}M</span>`;return `<span class="value">$${(n/1000).toLocaleString('en-US',{maximumFractionDigits:2})}B</span>`};
  const evidence=(x,key)=>key==='wood'?x.wood:key==='metal'?x.metal:null;
  const why=(x,key,tier)=>{const label=key==='wood'?'woodworking':key==='metal'?'metalworking':'relevant';const momentum=x.iip!=null?' · current IIP available':'';const size=tier.label==='HIGH OBSERVED BASE'?'Large':tier.label==='MODERATE OBSERVED BASE'?'Moderate':tier.label==='LIMITED OBSERVED BASE'?'Limited':'Insufficient published';return `${size} observed ${label} base${momentum}`};
  const render=()=>{
    const key=product.value, q=search.value.trim().toLowerCase(), by=sort.value;
    let list=rows.filter(x=>x.name.toLowerCase().includes(q));
    if(by==='overall')list.sort((a,b)=>(b.overall??-Infinity)-(a.overall??-Infinity));
    else if(by==='iip')list.sort((a,b)=>(b.iip??-Infinity)-(a.iip??-Infinity));
    else if(by==='fdi')list.sort((a,b)=>(b.fdiflow??-Infinity)-(a.fdiflow??-Infinity));
    else if(key!=='compare')list.sort((a,b)=>(evidence(b,key)??-Infinity)-(evidence(a,key)??-Infinity));
    else list.sort((a,b)=>((b.wood??0)+(b.metal??0))-((a.wood??0)+(a.metal??0)));
    const visible=expanded?list:list.slice(0,10);showAll.hidden=list.length<=10||expanded;showAll.textContent=`Show all ${list.length} provinces`;
    if(key==='compare'){
      results.innerHTML='<div class="province-compare"><table><thead><tr><th>Province</th><th>Overall opportunity</th><th>Woodworking base</th><th>Metalworking base</th><th>IIP growth</th><th>New foreign investment</th></tr></thead><tbody>'+visible.map(x=>{const wt=provinceTier(x.wood,woodValues),mt=provinceTier(x.metal,metalValues);return `<tr><td><strong>${provinceEsc(x.name)}</strong><div class="meta">${provinceEsc(x.row.unit_type||'province')} · ${provinceEsc(x.row.geo_unit_id||'')}</div></td><td>${fmt(x.overall)} <span class="meta">${x.coverage==null?'':`${Number(x.coverage).toFixed(0)}% evidence coverage`}</span></td><td>${fmt(x.wood)} <span class="tier ${wt.className}">${wt.label}</span></td><td>${fmt(x.metal)} <span class="tier ${mt.className}">${mt.label}</span></td><td>${fmt(x.iip,'% vs last year')}</td><td>${moneyB(x.fdiflow)}</td></tr>`}).join('')+'</tbody></table></div>';
      return;
    }
    results.innerHTML='<div class="province-card-grid">'+visible.map(x=>{const value=evidence(x,key),tier=provinceTier(value,key==='wood'?woodValues:metalValues);return `<article class="province-decision-card"><div class="province-card-head"><div><h3>${provinceEsc(x.name)}</h3><span class="meta">${provinceEsc(x.row.unit_type||'province')} · ${provinceEsc(x.row.geo_unit_id||'')}</span></div><span class="tier ${tier.className}">${tier.label}</span></div><div class="province-overall"><strong>${x.overall==null?'Not yet scored':Number(x.overall).toFixed(1)}</strong><span>Overall opportunity</span></div><strong class="province-base">${fmt(value)} relevant ${key==='wood'?'woodworking':'metalworking'} enterprises</strong><div class="province-metrics"><span>IIP growth <b>${fmt(x.iip,'% vs last year')}</b></span><span>New foreign investment <b>${moneyB(x.fdiflow)}</b></span><span>Cumulative foreign investment <b>${moneyB(x.stock)}</b></span></div><p class="province-why">${why(x,key,tier)}</p></article>`}).join('')+'</div>';
  };
  [search,product,sort].forEach(el=>el.addEventListener('input',()=>{expanded=false;render()}));showAll.addEventListener('click',()=>{expanded=true;render()});
  const apply=scope=>{tabs.querySelectorAll('button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.scope===scope)));section.hidden=scope!=='province';app.querySelectorAll('.layout').forEach(x=>x.hidden=scope==='province')};
  tabs.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>apply(b.dataset.scope)));apply('national');render();
};
window.addEventListener('lc3-region-data',e=>{installProvinceTabs(e.detail||window.__lc3RegionData);decorateRegionDetail();decorateRegionNumbers()});
