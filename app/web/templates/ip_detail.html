<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>IP Case · Sentinel Hub</title>
  <script src="/static/time.js"></script>
  <style>
  :root{
  color-scheme:dark;
  --void:#090c0f;
  --console:#0d1115;
  --deck:#11171c;
  --raised:#151c22;
  --ink:#edf3f5;
  --secondary:#a8b3b9;
  --tertiary:#76838a;
  --line:rgba(224,244,248,.09);
  --cyan:#59d8e6;
  --low:#55d6e8;
  --green:#64d59a;
  --yellow:#e8bd5b;
  --red:#ff766d;
  --r:8px
  }
  *{box-sizing:border-box}
  html{-webkit-font-smoothing:antialiased;background:var(--void)}
  body{margin:0;background:var(--void);color:var(--ink);font:13px/1.45 "Avenir Next",Avenir,"Segoe UI",sans-serif}
  a{color:inherit}
  .shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
  aside{position:sticky;top:0;height:100vh;padding:20px 12px;border-right:1px solid var(--line)}
  .brand{display:flex;gap:10px;align-items:center;padding:0 8px 22px}
  .brand-mark{display:grid;place-items:center;width:30px;height:30px;border:1px solid #59d8e655;border-radius:7px;color:var(--cyan);font:700 15px monospace}
  .brand strong{display:block;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
  .brand small{color:var(--tertiary)}
  nav{display:grid;gap:3px}
  .nav-item{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 10px;border-radius:5px;color:var(--tertiary);text-decoration:none;font-weight:600}
  .nav-item:hover,.nav-item.active{color:var(--ink);background:var(--deck)}
  .nav-item.active{box-shadow:inset 2px 0 var(--cyan)}
  .site-state{position:absolute;left:12px;right:12px;bottom:16px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--console)}
  .eyebrow{font:600 10px/1.2 monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--tertiary)}
  .online{display:flex;gap:7px;margin-top:7px;color:var(--secondary)}
  .dot{width:7px;height:7px;margin-top:5px;border-radius:50%;background:var(--green)}
  main{min-width:0;width:100%;max-width:none;padding:24px 32px 48px}
  .back{display:inline-block;margin-bottom:24px;color:var(--tertiary);text-decoration:none}
  .back:hover{color:var(--cyan)}
  .hero{display:flex;justify-content:space-between;gap:24px;padding-bottom:24px;border-bottom:1px solid var(--line)}
  h1{margin:5px 0 8px;font:650 clamp(27px,4vw,42px)/1.05 monospace;letter-spacing:-.055em}
  .subtitle{color:var(--secondary)}
  .actions{display:flex;gap:8px;flex-wrap:wrap}
  .button{display:inline-flex;align-items:center;min-height:40px;padding:0 13px;border:1px solid var(--line);border-radius:5px;background:var(--deck);color:var(--secondary);text-decoration:none;font-weight:700}
  .button:hover{color:var(--ink);background:var(--raised)}
  .button.primary{background:var(--cyan);border-color:transparent;color:#061013}
  button.button{font:700 13px/1 "Avenir Next",Avenir,"Segoe UI",sans-serif;cursor:pointer}

  .hero-grid{display:grid;grid-template-columns:1.5fr repeat(4,1fr);gap:1px;margin:24px 0;background:var(--line)}
  .stat{min-height:105px;padding:17px;background:var(--console)}
  .stat:first-child{background:var(--deck)}
  .value{display:block;margin-top:10px;font:650 26px/1 monospace;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
  .accent{color:var(--cyan)}
  .note{display:block;margin-top:8px;color:var(--tertiary);font-size:11px}

  /* UI-only classification state colors */
  .classification-stat{
  position:relative;
  transition:background-color .18s ease,box-shadow .18s ease
  }
  .classification-stat.critical{
  background:rgba(255,118,109,.105);
  box-shadow:inset 3px 0 0 var(--red)
  }
  .classification-stat.critical .accent{color:var(--red)}
  .classification-stat.medium{
  background:rgba(232,189,91,.10);
  box-shadow:inset 3px 0 0 var(--yellow)
  }
  .classification-stat.medium .accent{color:var(--yellow)}
  .classification-stat.low .accent{color:var(--low)}
  .classification-stat.good{
  background:rgba(100,213,154,.09);
  box-shadow:inset 3px 0 0 var(--green)
  }
  .classification-stat.good .accent{color:var(--green)}
  .abuse-state{font:700 14px monospace;text-transform:capitalize}.abuse-state.none{color:var(--secondary)}.abuse-state.historical{color:var(--cyan)}.abuse-state.recent{color:var(--yellow)}.abuse-state.persistent{color:var(--red)}
  .classification-stat.unknown{
  background:var(--deck);
  box-shadow:inset 3px 0 0 var(--tertiary)
  }
  .classification-stat.unknown .accent{color:var(--secondary)}

  .layout{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(280px,.75fr);gap:16px;align-items:start;margin-top:16px}
  .column{display:grid;gap:16px}
  .card{border:1px solid var(--line);border-radius:12px;background:var(--console);overflow:hidden}
  .card-head{display:flex;justify-content:space-between;gap:12px;padding:15px 17px;border-bottom:1px solid var(--line)}
  .card-head h2{margin:0;font-size:14px}
  .card-head small{color:var(--tertiary)}
  .body{padding:17px}
  .facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line)}
  .fact{min-height:68px;padding:12px;background:var(--console)}
  .label{display:block;color:var(--tertiary);font-size:11px}
  .fact strong{display:block;margin-top:5px;font:600 13px monospace;overflow-wrap:anywhere}
  .source{display:block;margin-top:4px;color:var(--tertiary);font-size:10px}

  .decision{
  padding:17px;
  background:rgba(89,216,230,.055);
  transition:background-color .18s ease,box-shadow .18s ease
  }
  .decision-top{display:flex;justify-content:space-between;gap:20px}
  .decision h2{margin:7px 0;font:650 22px/1.1 monospace;text-transform:uppercase}
  .decision p{margin:0;color:var(--secondary)}
  .score{color:var(--cyan);font:650 30px/1 monospace}
  .score small{display:block;margin-top:5px;color:var(--tertiary);font:11px sans-serif}
  .bar{height:5px;margin-top:18px;background:#fff1;border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--cyan)}
  .breakdown{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:17px}
  .breakdown div{padding-top:11px;border-top:1px solid var(--line)}
  .breakdown b{display:block;font:600 17px monospace}
  .breakdown span{display:block;margin-top:3px;color:var(--tertiary);font-size:10px}

  /* Decision summary follows the classification color too */
  .decision.critical{
  background:rgba(255,118,109,.075);
  box-shadow:inset 3px 0 0 rgba(255,118,109,.78)
  }
  .decision.critical .score{color:var(--red)}
  .decision.critical .bar i{background:var(--red)}
  .decision.medium{
  background:rgba(232,189,91,.065);
  box-shadow:inset 3px 0 0 rgba(232,189,91,.78)
  }
  .decision.medium .score{color:var(--yellow)}
  .decision.medium .bar i{background:var(--yellow)}
  .decision.low .score{color:var(--low)}
  .decision.low .bar i{background:var(--low)}
  .decision.good{
  background:rgba(100,213,154,.06);
  box-shadow:inset 3px 0 0 rgba(100,213,154,.72)
  }
  .decision.good .score{color:var(--green)}
  .decision.good .bar i{background:var(--green)}
  .decision.unknown .score{color:var(--secondary)}
  .decision.unknown .bar i{background:var(--tertiary)}
  .score-explainer{margin:16px 0;background:var(--console)}.score-explainer .body{padding:16px}.score-explainer-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}.score-explainer-head h2{margin:0;font-size:14px}.score-explainer-head p{margin:4px 0 0;color:var(--tertiary);font-size:11px}.score-total{text-align:right;color:var(--cyan);font:700 20px monospace}.score-total small{display:block;margin-top:3px;color:var(--tertiary);font:10px sans-serif}.score-formula{margin:14px 0 12px;padding:9px 10px;border:1px solid var(--line);border-radius:5px;background:var(--deck);color:var(--secondary);font:11px monospace;line-height:1.6;overflow-wrap:anywhere}.score-components{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line)}.score-component{min-height:122px;padding:12px;background:var(--console)}.score-component-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.score-component-code{color:var(--cyan);font:700 11px monospace}.score-component-points{font:700 14px monospace;color:var(--ink)}.score-component-points.negative{color:var(--green)}.score-component h3{margin:6px 0 4px;font-size:11px}.score-component p{min-height:30px;margin:0;color:var(--tertiary);font-size:10px;line-height:1.35}.score-component-reason{margin-top:8px;padding-top:7px;border-top:1px solid var(--line);color:var(--secondary);font-size:10px;line-height:1.35}.score-component-reason strong{color:var(--cyan)}.score-component-evidence{margin-top:6px;color:var(--secondary);font-size:10px;line-height:1.35}.score-component-evidence.muted{color:var(--disabled)}.confidence-detail{margin-top:14px;padding:12px;border:1px solid var(--line);background:var(--deck)}.confidence-detail-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.confidence-detail-head h3{margin:0;font-size:12px}.confidence-detail-head p{margin:4px 0 0;color:var(--tertiary);font-size:10px;line-height:1.4}.confidence-detail-head>strong{color:var(--cyan);font:700 18px monospace}.confidence-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;margin-top:10px;background:var(--line)}.confidence-row{display:flex;justify-content:space-between;gap:10px;padding:8px;background:var(--console);font-size:10px}.confidence-row span{color:var(--tertiary)}.confidence-row strong{color:var(--secondary);text-align:right}.confidence-factors{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;color:var(--secondary);font-size:10px;line-height:1.4}.confidence-factors span{padding:4px 6px;border:1px solid var(--line);border-radius:4px}.confidence-empty{margin-top:10px;color:var(--tertiary);font-size:10px}

  .pill{display:inline-block;padding:4px 8px;border:1px solid var(--line);border-radius:4px;color:var(--secondary);font:700 10px monospace;text-transform:uppercase}
  .pill.critical{color:var(--red);border-color:#ff766d55;background:rgba(255,118,109,.055)}
  .pill.medium{color:var(--yellow);border-color:#e8bd5b55;background:rgba(232,189,91,.045)}
  .pill.low{color:var(--low);border-color:#55d6e855;background:rgba(85,214,232,.045)}
  .pill.good{color:var(--green);border-color:#64d59a55;background:rgba(100,213,154,.045)}

  .location-card .body{padding:20px}.location-card .facts{grid-template-columns:repeat(2,minmax(0,1fr));gap:1px}.location-card .facts .fact{min-height:70px;padding:14px}.location-card .confidence-detail{margin-top:18px}.location-card .confidence-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .evidence{display:grid;gap:8px}
  .evidence-item{padding:10px 12px;border:1px solid rgba(89,216,230,.18);border-left:3px solid var(--cyan);border-radius:4px;background:rgba(89,216,230,.08);color:var(--secondary);font-size:12px}
  .evidence-item.rare-path-evidence{border-color:rgba(148,163,184,.22);border-left-color:var(--tertiary);background:rgba(148,163,184,.10)}
  .evidence-item.a{border-left-color:var(--cyan)}
  .evidence-item.b{border-left-color:var(--yellow)}
  .evidence-item.c{border-left-color:var(--green)}
  .evidence-item.d{border-left-color:var(--red)}
  .sources{display:grid;gap:6px;margin:0;padding:0;list-style:none}
  .sources li{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px solid var(--line);color:var(--secondary);font-size:12px}
  .sources em{color:var(--tertiary);font-style:normal;text-align:right}
  .path-list{display:grid;gap:10px}
  .path-row{padding:11px 12px;border:1px solid var(--line);border-radius:6px;background:var(--deck)}
  .path-meta{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
  .path-meta strong{min-width:0;overflow-wrap:anywhere;color:var(--ink);font:600 12px monospace}
  .path-meta span{flex:none;color:var(--tertiary);font-size:11px;text-align:right}
  .path-bar{height:4px;margin-top:9px;background:var(--line);border-radius:99px;overflow:hidden}
  .path-bar i{display:block;height:100%;background:var(--cyan);border-radius:inherit}
  .path-dates{display:block;margin-top:6px;color:var(--tertiary);font-size:10px}
  .overview-snapshot .classification-value{display:inline-flex;align-items:center;min-height:28px;transition:color .18s ease;letter-spacing:.04em}.overview-snapshot .classification-value.critical{color:var(--red)}.overview-snapshot .classification-value.medium{color:var(--yellow)}.overview-snapshot .classification-value.low{color:var(--low)}.overview-snapshot .classification-value.good{color:var(--green)}.overview-snapshot .classification-value.unknown{color:var(--secondary)}
  .ip-traffic{margin:24px 0 16px}.ip-traffic-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}.ip-traffic-head h2{margin:0;font-size:14px}.ip-traffic-summary{margin-top:5px;color:var(--tertiary);font:11px monospace}.ip-range{display:flex;gap:3px;padding:3px;border:1px solid var(--line);border-radius:6px;background:var(--deck)}.ip-range button{min-height:27px;padding:0 8px;border:0;border-radius:4px;background:transparent;color:var(--tertiary);font:600 10px monospace;cursor:pointer}.ip-range button.active,.ip-range button:hover{color:var(--ink);background:var(--console)}.investigation-tabs{display:flex;gap:4px;margin:24px 0 4px;padding:4px;border:1px solid var(--line);border-radius:8px;background:var(--deck);overflow-x:auto}.investigation-tabs button{min-height:34px;padding:0 14px;border:0;border-radius:5px;background:transparent;color:var(--tertiary);font:700 11px ui-monospace,monospace;cursor:pointer;white-space:nowrap}.investigation-tabs button:hover,.investigation-tabs button.active{background:var(--console);color:var(--ink)}[data-investigation-section][hidden]{display:none!important}.ip-traffic-chart{position:relative;height:210px;margin:15px 0}.ip-traffic-chart svg{width:100%;height:100%;display:block}.ip-traffic-chart .grid{stroke:var(--line);stroke-width:1}.ip-traffic-chart .axis{fill:var(--tertiary);font:10px monospace}.ip-traffic-chart .area{fill:rgba(89,216,230,.1)}.ip-traffic-chart .line{fill:none;stroke:var(--cyan);stroke-width:2;vector-effect:non-scaling-stroke}.ip-traffic-lower{display:grid;grid-template-columns:.8fr 1.2fr 1.2fr;gap:16px;padding-top:16px;border-top:1px solid var(--line)}.ip-traffic-block h3{margin:0 0 10px;font-size:12px}.status-list{display:grid;gap:8px}.status-row{display:grid;grid-template-columns:32px 1fr 42px;align-items:center;gap:8px;color:var(--secondary);font-size:11px}.status-row strong{font:600 11px monospace;text-align:right;color:var(--ink)}.status-track{height:7px;border-radius:99px;background:var(--deck);overflow:hidden}.status-track i{display:block;height:100%;background:var(--cyan)}.ip-top-paths{display:grid;gap:7px}.ip-top-path{display:flex;justify-content:space-between;gap:10px;color:var(--secondary);font:11px monospace}.ip-top-path span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ip-top-path strong{color:var(--ink)}.recent-list{display:grid;gap:6px;max-height:190px;overflow:auto}.recent-row{display:grid;grid-template-columns:62px 38px minmax(0,1fr) 32px;gap:7px;color:var(--secondary);font:10px monospace}.recent-row .recent-time{color:var(--tertiary)}.recent-row .recent-path{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.recent-row .status-4xx,.recent-row .status-5xx{color:var(--red)}
  .ip-traffic{margin:24px 0 16px}.ip-traffic-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}.ip-traffic-head h2{margin:0;font-size:14px}.ip-traffic-summary{margin-top:5px;color:var(--tertiary);font:11px monospace}.ip-range{display:flex;gap:3px;padding:3px;border:1px solid var(--line);border-radius:6px;background:var(--deck)}.ip-range button{min-height:27px;padding:0 8px;border:0;border-radius:4px;background:transparent;color:var(--tertiary);font:600 10px monospace;cursor:pointer}.ip-range button.active,.ip-range button:hover{color:var(--ink);background:var(--console)}.investigation-tabs{display:flex;gap:4px;margin:24px 0 4px;padding:4px;border:1px solid var(--line);border-radius:8px;background:var(--deck);overflow-x:auto}.investigation-tabs button{min-height:34px;padding:0 14px;border:0;border-radius:5px;background:transparent;color:var(--tertiary);font:700 11px ui-monospace,monospace;cursor:pointer;white-space:nowrap}.investigation-tabs button:hover,.investigation-tabs button.active{background:var(--console);color:var(--ink)}[data-investigation-section][hidden]{display:none!important}.overview-snapshot{margin:0 0 16px}.overview-snapshot-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.overview-snapshot .facts{grid-template-columns:repeat(2,minmax(0,1fr))}.overview-signals{display:grid;gap:8px}.overview-signal{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--deck);font-size:12px}.overview-signal span{color:var(--secondary)}.overview-signal strong{color:var(--ink);font-family:ui-monospace,monospace}.investigation-evidence-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.ip-traffic-chart{position:relative;height:210px;margin:15px 0}.ip-traffic-chart svg{width:100%;height:100%;display:block}.ip-traffic-chart .grid{stroke:var(--line);stroke-width:1}.ip-traffic-chart .axis{fill:var(--tertiary);font:10px monospace}.ip-traffic-chart .area{fill:rgba(89,216,230,.1)}.ip-traffic-chart .line{fill:none;stroke:var(--cyan);stroke-width:2;vector-effect:non-scaling-stroke}.ip-traffic-lower{display:grid;grid-template-columns:.8fr 1.2fr 1.2fr;gap:16px;padding-top:16px;border-top:1px solid var(--line)}.ip-traffic-block h3{margin:0 0 10px;font-size:12px}.status-list{display:grid;gap:8px}.status-row{display:grid;grid-template-columns:32px 1fr 42px;align-items:center;gap:8px;color:var(--secondary);font-size:11px}.status-row strong{font:600 11px monospace;text-align:right;color:var(--ink)}.status-track{height:7px;border-radius:99px;background:var(--deck);overflow:hidden}.status-track i{display:block;height:100%;background:var(--cyan)}.ip-top-paths{display:grid;gap:7px}.ip-top-path{display:flex;justify-content:space-between;gap:10px;color:var(--secondary);font:11px monospace}.ip-top-path span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ip-top-path strong{color:var(--ink)}.recent-list{display:grid;gap:6px;max-height:190px;overflow:auto}.recent-row{display:grid;grid-template-columns:62px 38px minmax(0,1fr) 32px;gap:7px;color:var(--secondary);font:10px monospace}.recent-row .recent-time{color:var(--tertiary)}.recent-row .recent-path{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.recent-row .status-4xx,.recent-row .status-5xx{color:var(--red)}
  .ip-time-filter{display:flex;align-items:end;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}.ip-time-filter label{display:grid;gap:4px;color:var(--tertiary);font:600 10px ui-monospace,monospace;letter-spacing:.03em}.ip-time-filter input{height:32px;padding:0 8px;border:1px solid var(--line);border-radius:5px;background:var(--void);color:var(--secondary);font:11px monospace}.ip-time-filter button{height:32px;padding:0 10px;border:1px solid var(--line);border-radius:5px;background:var(--deck);color:var(--secondary);font-weight:700;cursor:pointer}.ip-time-filter button:hover{color:var(--ink);background:var(--raised)}.ip-traffic-chart{overflow:visible}.ip-traffic-tooltip{position:absolute;z-index:2;pointer-events:none;min-width:130px;padding:8px 10px;border:1px solid var(--line);border-radius:5px;background:var(--console);box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;transform:translateY(4px);transition:opacity 140ms ease-out,transform 140ms ease-out;font:10px monospace}.ip-traffic-tooltip.show{opacity:1;transform:none}.ip-traffic-tooltip .time{color:var(--tertiary);margin-bottom:5px}.ip-traffic-tooltip .value{display:flex;justify-content:space-between;gap:16px;color:var(--secondary)}.ip-traffic-tooltip strong{color:var(--ink)}
  .layout .column{gap:12px}.investigate-links{display:grid;gap:8px}
  #ip-investigation-layout[data-active-tab="evidence"]{grid-template-columns:1fr 1fr}#ip-investigation-layout[data-active-tab="evidence"] .column{display:contents}#ip-investigation-layout[data-active-tab="evidence"] .investigation-evidence-grid{grid-column:1/-1}
  .external-link{display:flex;justify-content:space-between;align-items:center;padding:12px;border:1px solid var(--line);border-radius:6px;background:var(--deck);color:var(--cyan);text-decoration:none;font-weight:700}
  .external-link:hover{border-color:#59d8e677;background:var(--raised)}
  .external-link span{color:var(--tertiary);font-size:16px}
  .state{padding:64px 20px;text-align:center;color:var(--tertiary)}
  .state strong{display:block;margin-bottom:5px;color:var(--secondary)}

  @media(max-width:900px){
  .shell{display:block}
  aside{display:none}
  main{padding:18px 16px 36px}
  .hero-grid{grid-template-columns:repeat(2,1fr)}
  .stat:first-child{grid-column:1/-1}
  .layout{grid-template-columns:1fr}
  #ip-investigation-layout[data-active-tab="evidence"]{grid-template-columns:1fr}
  .investigation-evidence-grid,.overview-snapshot-grid{grid-template-columns:1fr}
  .ip-traffic-lower{grid-template-columns:1fr 1fr}
  .score-components{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
  @media(max-width:560px){
  .hero{display:block}
  .actions{margin-top:18px}
  .facts{grid-template-columns:1fr}
  .decision-top{display:block}
  .score{margin-top:18px}
  .breakdown{grid-template-columns:repeat(2,1fr)}
  .ip-traffic-head{display:block}.ip-range{margin-top:12px;overflow-x:auto}.ip-traffic-lower{grid-template-columns:1fr}
  .score-explainer-head{display:block}.score-total{text-align:left;margin-top:12px}.score-components{grid-template-columns:1fr}
  }

  /* Operational Geo and RIR registration are separate evidence classes */
  .location-status-note{margin-top:14px;padding:11px 12px;border:1px solid #59d8e633;border-left:3px solid var(--cyan);border-radius:6px;background:#59d8e60a;color:var(--secondary);font-size:11px;line-height:1.5}
  .location-status-note.warning{border-color:#e8bd5b44;border-left-color:var(--yellow);background:#e8bd5b0c}
  .location-status-note strong{color:var(--ink)}
  .location-details{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}.location-details summary{cursor:pointer;color:var(--cyan);font:700 11px ui-monospace,monospace;list-style:none}.location-details summary::-webkit-details-marker{display:none}.location-details summary::before{content:'+';display:inline-block;width:16px;color:var(--cyan)}.location-details[open] summary::before{content:'−'}.location-details .facts{margin-top:10px}.location-details .fact strong{font-size:12px;font-weight:500}.location-primary .fact strong{font-size:13px;font-weight:500}.location-primary .label{color:var(--ink);font-weight:700}
  .location-legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .location-legend span{padding:4px 6px;border:1px solid var(--line);border-radius:4px;color:var(--tertiary);font:700 9px monospace;text-transform:uppercase}
  .location-legend .operational{color:var(--cyan);border-color:#59d8e644;background:#59d8e60b}
  .location-legend .registration{border-style:dashed}
  .location-legend .disputed{color:var(--yellow);border-color:#e8bd5b55;background:#e8bd5b0b}
  .confidence-row.registration{border-left:2px dashed var(--tertiary);opacity:.78}
  .confidence-row.registration span::after{content:' · excluded from operational vote';color:var(--tertiary)}
  .confidence-factors span.registration-factor{border-style:dashed;color:var(--tertiary)}
  .confidence-factors span.dispute-factor{color:var(--yellow);border-color:#e8bd5b55;background:#e8bd5b0b}

  /* Case Triage & Disposition Card */
  .triage-card{border-color:rgba(89,216,230,.25)!important}
  .triage-badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:4px;font:700 10px ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase}
  .triage-badge.new{color:var(--secondary);background:rgba(255,255,255,.07);border:1px solid var(--line)}
  .triage-badge.monitor{color:var(--cyan);background:rgba(89,216,230,.12);border:1px solid rgba(89,216,230,.3)}
  .triage-badge.investigate{color:var(--yellow);background:rgba(232,189,91,.15);border:1px solid rgba(232,189,91,.35)}
  .triage-badge.escalate{color:var(--red);background:rgba(255,118,109,.18);border:1px solid rgba(255,118,109,.4)}

  .triage-selector{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:12px 0}
  .triage-opt{min-height:36px;padding:6px 4px;border:1px solid var(--line);border-radius:6px;background:var(--deck);color:var(--secondary);font:700 11px ui-monospace,monospace;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 140ms ease}
  .triage-opt:hover{color:var(--ink);background:var(--raised)}
  .triage-opt.active.new{background:var(--console);color:var(--ink);border-color:var(--secondary);box-shadow:0 0 0 1px var(--secondary)}
  .triage-opt.active.monitor{background:rgba(89,216,230,.2);color:var(--cyan);border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan)}
  .triage-opt.active.investigate{background:rgba(232,189,91,.2);color:var(--yellow);border-color:var(--yellow);box-shadow:0 0 0 1px var(--yellow)}
  .triage-opt.active.escalate{background:rgba(255,118,109,.25);color:var(--red);border-color:var(--red);box-shadow:0 0 0 1px var(--red)}
  .triage-opt.active.resolved{background:rgba(100,213,154,.2);color:var(--green);border-color:var(--green);box-shadow:0 0 0 1px var(--green)}

  .triage-fields{display:grid;gap:10px;margin-top:12px}
  .triage-field label{display:block;margin-bottom:4px;color:var(--tertiary);font:600 10px monospace;text-transform:uppercase;letter-spacing:.05em}
  .triage-field input,.triage-field textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--deck);color:var(--ink);font:12px "Avenir Next",Avenir,"Segoe UI",sans-serif}
  .triage-field textarea{resize:vertical;min-height:60px}
  .triage-actions{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
  .triage-history{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
  .triage-history-item{padding:8px 10px;border-radius:5px;background:var(--deck);border:1px solid var(--line);margin-bottom:6px;font-size:11px}
  .triage-history-head{display:flex;justify-content:space-between;color:var(--tertiary);font:600 10px monospace}

  .ai-explain-card{border-color:rgba(89,216,230,.25)!important}

  .ai-explain-status.completed{color:var(--green);border-color:#64d59a55;background:#64d59a12}
  .ai-explain-status.failed{color:var(--red);border-color:#ff766d55;background:#ff766d12}
  .ai-explain-status.running,.ai-explain-status.pending{color:var(--yellow);border-color:#e8bd5b55;background:#e8bd5b12}
  .ai-explain-intro{margin:0;color:var(--tertiary);font-size:11px}
  .ai-explain-copy{display:grid;gap:14px;margin-top:14px}
  .ai-explain-block h3{margin:0 0 6px;color:var(--secondary);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
  .ai-explain-block p{margin:0;color:var(--secondary);white-space:pre-wrap;text-wrap:pretty}
  .ai-evidence-ref{display:grid;gap:4px;padding:9px 10px;border-left:2px solid var(--cyan);background:var(--deck);font-size:11px}
  .ai-evidence-ref strong{color:var(--ink);font-size:11px}
  .ai-evidence-ref span{color:var(--secondary)}
  .ai-investigation{margin:0;padding-left:18px;color:var(--secondary);font-size:11px}
  .ai-validation{margin-top:14px;padding-top:10px;border-top:1px solid var(--line);color:var(--green);font:700 10px monospace;text-transform:uppercase}
  .evidence-disclosure{margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
  .evidence-disclosure summary{cursor:pointer;color:var(--cyan);font:600 11px monospace;list-style-position:inside}

  .evidence-disclosure .evidence-item{margin-top:8px}
  .ai-explain-error{color:var(--red);font-size:11px}

</head>
<body>
  <div class="shell">
    <aside>
      <div class="brand">
        <div class="brand-mark">
          S
        </div>
        <div>
          <strong>Sentinel Hub</strong><small>remote monitor</small>
        </div>
      </div>
      <nav>
        <a class="nav-item" href="/">⌁ Overview</a> <a class="nav-item active" href="/#threats">◎ IP Intelligence</a> <a class="nav-item" href="/alerts">! Alerts</a> <a class="nav-item" href="/regions">◇ Region profiles</a>
      </nav>
      <div class="site-state">
        <div class="eyebrow">
          Hub state
        </div>
        <div class="online">
          <span class="dot"></span>Read-only · Online
        </div>
      </div>
    </aside>
    <main id="app">
      <div class="state">
        <strong>Loading IP case…</strong>Correlating geo, network and observed behavior.
      </div>
    </main>
  </div>
  <script>
  const initialTheme=localStorage.getItem('sentinel-theme')||'dark';
  document.documentElement.dataset.theme=initialTheme;
  const API_BASE='';
  const mode='live';
  const apiUrl=path=>{if(path.startsWith('/api/')&&!/[?&]mode=/.test(path))path+=`${path.includes('?')?'&':'?'}mode=${mode}`;return API_BASE+path};
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const num=v=>{const n=Number(v);return Number.isFinite(n)?n.toLocaleString('en-US',{maximumFractionDigits:2}).replace(/,/g,' '):'—'};
  const displayMetric=v=>{
  if(v==null||v==='')return 'Unknown';
  const raw=String(v).trim(), n=Number(raw);
  return raw!==''&&Number.isFinite(n)?num(n):v;
  };
  const ip=decodeURIComponent(location.pathname.split('/').pop());

  const nativeFetch=window.fetch.bind(window);
  window.fetch=(input,...args)=>nativeFetch(typeof input==='string'&&input.startsWith('/api/')?apiUrl(input):input,...args);

  function facts(items,className=''){
  return `<div class="facts ${className}">${items.map(([a,b,s])=>`<div class="fact"><span class="label">${esc(a)}</span><strong>${esc(b??'Unknown')}</strong>${s?`<span class="source">${esc(s)}</span>`:''}</div>`).join('')}</div>`
  }
  function list(items){
  return items?.length
    ?items.map(x=>{
      const t=String(x),g=/^([ABCDE])\s—/.exec(t)?.[1]?.toLowerCase()||'';
      return `<div class="evidence-item ${g}">${esc(t)}</div>`
    }).join('')
    :'<div class="evidence-item">No evidence available.</div>'
  }
  function yes(v){return v==null?'Unknown':v?'Yes':'No'}
  function freshness(value){if(!value)return {label:'unknown',tone:'stale'};const age=Math.max(0,Date.now()-Date.parse(value)),minutes=Math.floor(age/60000);return {label:minutes<1?'just now':minutes<60?`${minutes} min ago`:minutes<1440?`${Math.floor(minutes/60)} h ago`:`${Math.floor(minutes/1440)} d ago`,tone:minutes<5?'fresh':minutes<60?'recent':'stale'}}
  function investigationLinks(value){
  const safe=encodeURIComponent(value);
  const links=[
    ['AbuseIPDB',`https://www.abuseipdb.com/check/${safe}`],
    ['CrowdSec CTI',`https://app.crowdsec.net/cti/${safe}`],
    ['VirusTotal',`https://www.virustotal.com/gui/ip-address/${safe}`],
    ['Cisco Talos',`https://www.talosintelligence.com/reputation_center/lookup?search=${safe}`],
    ['Shodan',`https://www.shodan.io/host/${safe}`],
    ['Censys',`https://platform.censys.io/search?q=${encodeURIComponent(`host.ip="${value}"`)}`],
    ['WHOIS / MSK-IX',`https://whois.msk-ix.ru/en/?dmn=${safe}&tp=auto&cb=anasini6rtr6dn&src=rir`],
  ];
  return `<div class="investigate-links">${links.map(([label,href])=>`<a class="external-link" href="${href}" target="_blank" rel="noopener noreferrer">${label} <span>↗</span></a>`).join('')}</div>`
  }
  function rarePathEvidence(items){
  const paths=Array.isArray(items)?items:[],render=item=>`<div class="evidence-item rare-path-evidence">${esc(item.path||'Unknown path')} · rarity ${esc(item.rarity_score??'—')}/100 · first seen ${item.first_seen?window.formatVnTime(item.first_seen):'unknown'}<br><small>${esc(item.explanation||'Rarity alone does not establish malicious intent.')}</small></div>`;
  if(!paths.length)return '<div class="evidence-item rare-path-evidence">No rare path evidence available.</div>';
  const visible=paths.slice(0,8).map(render).join(''),remaining=paths.slice(8);
  return visible+(remaining.length?`<details class="evidence-disclosure"><summary>Show ${remaining.length} more rare paths</summary>${remaining.map(render).join('')}</details>`:'');
  }
  function scoreExplainer(b,c){
  const parts=[
    ['A','Behavior',Number(b.behavior_a||0),100,'Request behavior: bursts, probes, bot patterns, 4xx/5xx signals.'],
    ['B','Network identity',Number(b.identity_b||0),25,'Tor, proxy, VPN and hosting signals. Identity contribution capped at +25.'],
    ['C','Trust adjustment',Number(b.trust_c||0),20,'Trusted attributed network can reduce score when behavior risk is low.'],
    ['D','Region signal',Number(b.region_d||0),5,'Conflict nudge. Only active when behavior signal exists.'],
    ['E','AI anomaly',Number(b.ai_e||0),8,'AI anomaly bonus. Requires low rule score and enough scored windows.'],
  ];
  const evidence=Array.isArray(c.evidence)?c.evidence:[],explanations=c.score_explanations||{};
  const signed=value=>value>0?`+${value}`:String(value);
  const cards=parts.map(([code,name,value,max,description])=>{const matches=evidence.filter(item=>String(item).startsWith(`${code} —`));return `<article class="score-component"><div class="score-component-head"><span class="score-component-code">${code}</span><span class="score-component-points ${value<0?'negative':''}">${signed(value)} <small>/ ${max}</small></span></div><h3>${name}</h3><p>${description}</p><div class="score-component-reason"><strong>Why:</strong> ${esc(explanations[code]||'No calculation note available.')}</div><div class="score-component-evidence ${matches.length?'':'muted'}">${matches.length?matches.map(item=>esc(item)).join('<br>'):'No direct evidence'}</div></article>`}).join('');
  const formula=parts.map(([code,,value])=>`${code} ${signed(value)}`).join('  ');
  return `<section class="card score-explainer" data-investigation-section="detections"><div class="card-head"><div><h2>Detection breakdown</h2><small>Auditable rule groups behind the current score</small></div><span class="score-total">${num(c.score??0)} / 100<small>final threat score</small></span></div><div class="body"><div class="score-formula">${formula}  =  ${num(c.score??0)} final · range 0–100<br><span>${esc(explanations.final||'')}</span></div><div class="score-components">${cards}</div></div></section>`
  }
  let aiJobId=sessionStorage.getItem(`hub:ai-explain-job:${ip}`)||'',aiJobState=null,aiPollTimer=null,aiPollActive=false,aiEvidenceCatalog=new Map();
  function aiStatusLabel(state){return ({pending:'Pending',running:'Running',completed:'Grounding validated',failed:'Failed'})[state]||'Not requested'}
  function aiEvidenceTitle(item){
    if(item?.path)return `Rare path · ${item.path}`;
    if(item?.type)return String(item.type).replaceAll('_',' ').replace(/\b\w/g,ch=>ch.toUpperCase());
    if(item?.description)return item.description;
    return 'Referenced evidence';
  }
  function setAiEvidenceCatalog(data){
    aiEvidenceCatalog=new Map();
    const items=[...(data?.classification?.evidence||[]),...(data?.observation?.rare_path_evidence||[]),...(data?.evidence||[])];
    items.forEach(item=>{
      if(item&&typeof item==='object'&&item.evidence_id)aiEvidenceCatalog.set(String(item.evidence_id),item);
    });
  }
  function aiEvidence(items){
    return (Array.isArray(items)&&items.length)?items.map(item=>{const id=String(item?.evidence_id||''),source=aiEvidenceCatalog.get(id),title=aiEvidenceTitle(source),detail=item?.reason||source?.description||'Referenced evidence';return `<div class="ai-evidence-ref"><strong>${esc(title)}</strong><span>${esc(detail)}</span></div>`}).join(''):'<p>No evidence references returned.</p>';
  }
  function aiExplainPanel(){
    const state=aiJobState?.status||'idle',analysis=aiJobState?.analysis,validation=aiJobState?.validation;
    const status=state==='idle'?'Not requested':aiStatusLabel(state),cls=state==='idle'?'':state;
    let content='<p class="ai-explain-intro">On-demand local reasoning. It supports investigation and never changes classification or risk.</p>';
    if(state==='pending'||state==='running')content+='<div class="state">Analysis in progress. This may take up to a few minutes on local CPU.</div>';
    if(state==='failed')content+=`<p class="ai-explain-error">${esc(aiJobState.failure_code||'AI analysis unavailable. No automatic retry was performed.')}</p>`;
    if(state==='completed'&&analysis){content=`<div class="ai-explain-copy"><div class="ai-explain-block"><h3>Summary</h3><p>${esc(analysis.summary)}</p></div><div class="ai-explain-block"><h3>Primary evidence</h3>${aiEvidence(analysis.primary_evidence)}</div><div class="ai-explain-block"><h3>Supporting evidence</h3>${aiEvidence(analysis.supporting_evidence)}</div><div class="ai-explain-block"><h3>Alternative explanation</h3><p>${esc(analysis.alternative_explanation)}</p></div><div class="ai-explain-block"><h3>Model-stated uncertainty · not a confidence score</h3><p>${esc(analysis.uncertainty)}</p></div><div class="ai-explain-block"><h3>Recommended investigation</h3>${analysis.recommended_investigation?.length?`<ul class="ai-investigation">${analysis.recommended_investigation.map(item=>`<li>${esc(item)}</li>`).join('')}</ul>`:'<p>No recommendation returned.</p>'}</div></div><div class="ai-validation">AI-generated analysis · grounding validated</div>`}
    const canRequest=state==='idle'||state==='failed';
    return `<section class="card ai-explain-card" data-investigation-section="overview"><div class="card-head"><div><h2>AI Case Analysis</h2><small>case explainer · non-authoritative</small></div><span class="ai-explain-status ${cls}" id="ai-explain-status">${status}</span></div><div class="body"><div id="ai-explain-content">${content}</div><div class="triage-actions"><span class="note">${aiJobId?'Job '+esc(aiJobId):'Manual only'}</span><button type="button" class="button primary" id="ai-explain-button" ${canRequest?'':'disabled'}>${state==='failed'?'Explain again':'Explain with AI'}</button></div></div></section>`;
  }
  function renderAiExplainInPlace(){
    const current=document.querySelector('.ai-explain-card');if(!current)return;
    const wrapper=document.createElement('div');wrapper.innerHTML=aiExplainPanel();
    const next=wrapper.firstElementChild;if(next){next.hidden=current.hidden;current.replaceWith(next);setupAiExplain()}
  }
  function scheduleAiPoll(){
    if(aiPollTimer||!aiJobId)return;
    aiPollTimer=setTimeout(()=>{aiPollTimer=null;pollAiJob()},3000);
  }
  async function pollAiJob(){
    if(aiPollActive||!aiJobId)return;
    aiPollActive=true;
    try{
      const res=await fetch(`/api/ai/jobs/${encodeURIComponent(aiJobId)}`,{cache:'no-store'});
      if(!res.ok)throw Error(`HTTP ${res.status}`);
      aiJobState=await res.json();
      if(aiJobState.status==='pending'||aiJobState.status==='running')scheduleAiPoll();
      renderAiExplainInPlace();
    }catch(error){aiJobState={status:'failed',failure_code:`status_unavailable: ${error.message}`};renderAiExplainInPlace()}
    finally{aiPollActive=false}
  }
  function setupAiExplain(){
    document.querySelector('#ai-explain-button')?.addEventListener('click',async()=>{
      const button=document.querySelector('#ai-explain-button');if(button)button.disabled=true;
      try{
        const res=await fetch(`/api/ai/cases/${encodeURIComponent(ip)}/explain`,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
        if(!res.ok)throw Error(`HTTP ${res.status}`);
        const accepted=await res.json();aiJobId=accepted.job_id;sessionStorage.setItem(`hub:ai-explain-job:${ip}`,aiJobId);aiJobState={status:accepted.status};renderAiExplainInPlace();
        if(accepted.status==='pending'||accepted.status==='running')pollAiJob();
      }catch(error){aiJobState={status:'failed',failure_code:`request_failed: ${error.message}`};renderAiExplainInPlace()}
    });
    if(aiJobId&&!aiJobState)pollAiJob();
  }

  function allocationLabel(value){
  return ({
    cross_region_allocation:'Cross-region allocation',
    consistent:'Registration aligned',
    registration_estimate_only:'RIR estimate only',
    registration_unavailable:'RIR unavailable',
    no_operational_evidence:'No operational evidence',
    unknown:'Unknown'
  })[value]||String(value||'unknown').replaceAll('_',' ');
  }
  function locationContextNote(location){
  const canonical=location?.canonical_resolution||{},status=canonical.status||{},reg=location?.registration||null;
  const country=status.country||'unknown',city=status.city||'unknown',coordinates=status.coordinates||'unknown';
  const note=country==='resolved'&&city==='disputed'
    ? `Country resolved. City sources disagree, so city and coordinates are left unresolved.`
    : `Country: ${country}. City: ${city}. Coordinates: ${coordinates}.`;
  return {tone:city==='disputed'||coordinates==='disputed'?'warning':'',html:`<strong>Location conclusion.</strong> ${note} ${reg?'RIR is shown separately as ownership context.':''}`};
  }
  function countryName(value){
  const code=String(value||'').trim().toUpperCase();
  if(!code)return 'Unknown';
  try{return new Intl.DisplayNames(['en'],{type:'region'}).of(code)||code}catch(_){return code}
  }
  function countryPresentation(location){
  const canonical=location?.canonical_resolution||{},status=canonical.status?.country||'unknown',resolved=canonical.resolved?.country_code||location?.country_code||null,candidates=Array.isArray(canonical.candidates?.country)?canonical.candidates.country:[];
  const top=candidates[0]?.value||null;
  const displayCode=resolved||top||null;
  const displayName=displayCode?countryName(displayCode):status==='disputed'?'Disputed':'Unknown';
  const confidenceRows=candidates.slice(0,3).map(item=>`${countryName(item.value)} ${num(item.confidence)}%`).join(', ');
  const cityCandidate=canonical.candidates?.city?.[0];
  const cityCountry=(cityCandidate?.country_codes||[])[0]||cityCandidate?.country_code||cityCandidate?.country||null;
  const conflict=cityCountry&&top&&String(cityCountry).toUpperCase()!==String(top).toUpperCase();
  return {status,code:displayCode||top||'—',name:displayName,candidates:confidenceRows,conflict};
  }
  function geoConfidenceDetails(location){
  const breakdown=location?.confidence_breakdown||{},sources=Array.isArray(breakdown.sources)?breakdown.sources:[];
  const fallbackSources=Array.isArray(location?.sources)?location.sources:[];
  const evidenceSources=sources.length?sources:fallbackSources.map(source=>({source,country_code:location?.country_code,scope:location?.scope,confidence:null}));
  const rows=evidenceSources.map(item=>{
    const registration=item.scope==='registration';
    return `<div class="confidence-row ${registration?'registration':''}"><span>${esc(item.source||'unknown')} · ${esc(item.country_code||'—')} · ${esc(item.scope||'network')}</span><strong>${item.confidence==null?'contributed':`${num(item.confidence)}%`}</strong></div>`;

          <section class="card" data-investigation-section="intel">
            <div class="card-head"><h2>Provider status</h2></div>
            <div class="body">
              <ul class="sources">${
                Object.entries(d.provider_status||{}).filter(([,v])=>v.status!=='not_configured')
                  .map(([n,v])=>`<li><span>${esc(n)}</span><em>${esc(v.status)}${v.error?` · ${esc(v.error)}`:''}</em></li>`)
                  .join('')
                || '<li><span>No provider metadata</span><em>unknown</em></li>'
              }</ul>
            </div>
          </section>

          <div class="investigation-evidence-grid" data-investigation-section="evidence">
          <section class="card">
            <div class="card-head"><h2>Identity evidence</h2></div>
            <div class="body"><div class="evidence">${list(d.identity_evidence)}</div></div>
          </section>
          <section class="card">
            <div class="card-head"><h2>Rare path evidence</h2></div>
            <div class="body"><div class="evidence">${rarePathEvidence(o.rare_path_evidence)}</div></div>
          </section>
          </div>
          <section class="card" data-investigation-section="intel">
            <div class="card-head"><h2>Data freshness</h2></div>
            <div class="body">${[['Rules',freshRules],['Rare baseline',freshRare],['Geo',freshGeo],['Threat intel',freshIntel]].map(([name,item])=>`<div class="fact"><span class="label">${name}</span><strong>${item.label}</strong></div>`).join('')}</div>
          </section>
        </div>
      </div>
    `
    let activeDispState=(d.disposition?.state||'new').toLowerCase();
    document.querySelectorAll('#detail-triage-selector .triage-opt').forEach(btn=>{
      btn.addEventListener('click',()=>{
        activeDispState=btn.dataset.state;
        document.querySelectorAll('#detail-triage-selector .triage-opt').forEach(b=>b.classList.toggle('active',b.dataset.state===activeDispState));
      });
    });

    document.querySelector('#detail-disp-save')?.addEventListener('click',async()=>{
      const saveBtn=document.querySelector('#detail-disp-save');
      const assignee=document.querySelector('#detail-disp-assignee')?.value.trim()||null;
      const note=document.querySelector('#detail-disp-note')?.value.trim()||null;
      if(saveBtn){saveBtn.disabled=true;saveBtn.textContent='Saving…';}
      try{
        const res=await fetch(apiUrl(`/api/ip/${encodeURIComponent(ip)}/disposition`),{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({state:activeDispState,assigned_to:assignee,note:note,actor:'analyst'})
        });
        if(!res.ok)throw new Error('HTTP '+res.status);
        const saved=await res.json();
        const badge=document.querySelector('#triage-status-badge');
        if(badge){
          badge.className=`triage-badge ${activeDispState}`;
          badge.textContent=activeDispState.toUpperCase();
        }
        const timeNote=document.querySelector('#detail-disp-time');
        if(timeNote)timeNote.textContent='Saved just now';
        load();
      }catch(err){
        alert('Failed to save disposition: '+err.message);
      }finally{
        if(saveBtn){saveBtn.disabled=false;saveBtn.textContent='Save Triage';}
      }
    });

    function setInvestigationTab(tab){
      const investigationLayout=document.querySelector('#ip-investigation-layout');
      if(investigationLayout)investigationLayout.dataset.activeTab=tab;
      document.querySelectorAll('[data-investigation-tab]').forEach(button=>button.classList.toggle('active',button.dataset.investigationTab===tab));
      document.querySelectorAll('[data-investigation-section]').forEach(section=>{section.hidden=section.dataset.investigationSection!==tab});
    }
    document.querySelectorAll('[data-investigation-tab]').forEach(button=>button.addEventListener('click',()=>setInvestigationTab(button.dataset.investigationTab)));
    setInvestigationTab('overview');
    if(!restoreIpTrafficWindow())selectCaseTrafficWindow();
    document.querySelectorAll('[data-ip-range]').forEach(button=>button.addEventListener('click',()=>{if(button.dataset.ipRange==='case')selectCaseTrafficWindow();else{trafficRange=button.dataset.ipRange;trafficStart='';trafficEnd=''}document.querySelector('#ip-traffic-start').value='';document.querySelector('#ip-traffic-end').value='';document.querySelectorAll('[data-ip-range]').forEach(item=>item.classList.toggle('active',item.dataset.ipRange===trafficRange));saveIpTrafficWindow();loadIpTraffic()}));
    document.querySelector('#ip-traffic-apply').addEventListener('click',applyTrafficWindow);
    document.querySelector('#ip-traffic-clear').addEventListener('click',()=>{selectCaseTrafficWindow();document.querySelector('#ip-traffic-start').value='';document.querySelector('#ip-traffic-end').value='';document.querySelectorAll('[data-ip-range]').forEach(item=>item.classList.toggle('active',item.dataset.ipRange===trafficRange));saveIpTrafficWindow();loadIpTraffic()});
    document.querySelectorAll('[data-ip-range]').forEach(item=>item.classList.toggle('active',item.dataset.ipRange===trafficRange));
    syncTrafficInputs(trafficStart&&localIso(trafficStart)||new Date(Date.now()-3600000).toISOString(),trafficEnd&&localIso(trafficEnd)||new Date().toISOString());
    const themeButton=document.querySelector('#theme-toggle');themeButton.addEventListener('click',()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('sentinel-theme',next);themeButton.textContent=next==='dark'?'Light mode':'Dark mode'});
    loadIpTraffic(true);
    setupAiExplain();

  }catch(e){
    document.querySelector('#app').innerHTML=`
      <div class="state">
        <strong>IP case unavailable</strong>${esc(e.message)}<br><br>
        <a class="button primary" href="/#threats">Return to IP intelligence</a>
      </div>`
  }
  }
  let detailRealtimeSource=null,detailRealtimeTimer=null,detailRealtimeRunning=false,detailRealtimePending=false;
  async function refreshDetailLive(){
  const res=await fetch('/api/ip/'+encodeURIComponent(ip)+'?mode=live',{cache:'no-store'});
  if(!res.ok)throw Error('Could not refresh profile');
  const d=await res.json(),c=d.classification||{},o=d.observation||{},dispState=(d.disposition?.state||'new').toLowerCase();
  const displayStatus=formatStatusWithDisposition(c.label||'unknown',dispState);
  const set=(selector,value)=>{const node=document.querySelector(selector);if(node)node.textContent=value};
  const classificationValue=document.querySelector('#detail-classification-value');
  if(classificationValue){classificationValue.className=`classification-value ${(c.label||'unknown').toLowerCase()}`;classificationValue.textContent=displayStatus.toUpperCase()}
  set('#detail-rule-score',`${Number(d.threat_signal_score??c.score??0)}/100`);
  set('#hero-score-badge',`${Number(d.threat_signal_score??c.score??0)}/100`);
  const heroBadge=document.querySelector('#hero-classification-badge');
  if(heroBadge){
    heroBadge.className=`triage-badge ${(c.label||'unknown').toLowerCase()}`;
  }
  set('#detail-request-count',num(o.requests));
  set('#detail-4xx-ratio',`${o.requests?Math.round(Number(o.status_4xx||0)/Number(o.requests)*100):0}%`);
  set('#detail-core-status',d.core_enrichment_status||'unknown');
  }
  function scheduleDetailRealtimeRefresh(){
  if(detailRealtimeTimer)return;
  detailRealtimeTimer=setTimeout(async()=>{
    detailRealtimeTimer=null;
    if(detailRealtimeRunning){detailRealtimePending=true;return}
    detailRealtimeRunning=true;
    try{await Promise.all([refreshDetailLive(),loadIpTraffic(false)])}
    catch(_){ }
    finally{
      detailRealtimeRunning=false;
      if(detailRealtimePending){detailRealtimePending=false;scheduleDetailRealtimeRefresh()}
    }
  },350);
  }
  function startDetailRealtime(){
  if(!window.EventSource||detailRealtimeSource)return;
  try{detailRealtimeSource=new EventSource('/api/stream')}catch(_){return}
  detailRealtimeSource.addEventListener('ip_changes',event=>{
    try{
      const payload=JSON.parse(event.data),ips=Array.isArray(payload.ips)?payload.ips:[];
      if(ips.some(value=>String(value)===String(ip)))scheduleDetailRealtimeRefresh();
    }catch(_){ }
  });
  detailRealtimeSource.onerror=()=>{};
  }
  load();startDetailRealtime();
  </script>
</body>
</html>
