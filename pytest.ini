[pytest]
markers =
    integration: requires native PostgreSQL/ClickHouse services
    parity: deterministic old-vs-new semantic comparisons
    failure: crash/replay/outage validation
    outage: M2C live outage simulations
    smoke: native live-mode HTTP smoke tests
    unit: fast isolated tests
    soak: long-running live validation
    asyncio: async test
testpaths = tests
addopts = -q
